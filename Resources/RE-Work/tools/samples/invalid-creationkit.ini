; Sample CreationKit.ini -- exercises every failure mode the oracle detects.
; Expected failures: fAutoCloseDelay= (empty float -> READ-FAIL),
; fGrassDefaultStartFadeDistance=not-a-float (garbage float -> READ-FAIL),
; bAllowCreateGrass under [General] instead of [Grass] (known key, wrong
; section -> UNKNOWN with a note), bTotallyMadeUp (dead key -> UNKNOWN),
; bAllowGameStartFromEditor=yes (garbage bool -> READ-AS-ZERO).
[General]
bAllowDynamicHavok=1
bAllowGameStartFromEditor=yes
bAllowCreateGrass=1
fAutoCloseDelay=
sLanguage=ENGLISH
bTotallyMadeUp=1

[Display]
bAutoViewDistance=1
iAutoViewHiFrameRate=60

[Grass]
bAllowLoadGrass=1
fGrassDefaultStartFadeDistance=not-a-float
