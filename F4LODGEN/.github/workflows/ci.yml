name: clang-ci

on:
  push:
    branches: [main, work/open-issues-20260818]
  pull_request:

permissions:
  contents: read

concurrency:
  group: f4lodgen-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang:
    runs-on: [self-hosted, Linux, X64, f4lodgen]
    env:
      CC: clang
      CXX: clang++

    steps:
      - uses: actions/checkout@v4

      - name: Verify build toolchain
        shell: bash
        run: |
          set -euo pipefail
          for tool in clang clang++ cmake ninja; do
            command -v "$tool"
          done
          clang --version
          cmake --version
          ninja --version

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DF4LOD_BUILD_TESTS=ON
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: CLI smoke
        run: ./build/f4lodgen --help

      - name: Upload binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: f4lodgen-clang-ci
          retention-days: 3
          path: |
            build/f4lodgen
            build/f4lod-btr-probe
            build/f4lod-calibrate-commonwealth
          if-no-files-found: warn
