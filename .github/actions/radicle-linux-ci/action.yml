name: radicle-linux-ci
description: Configure, build, and test the Radicle SDK on Linux.

inputs:
  install-deps:
    description: 'Install ninja/zlib via apt first (hosted runners only)'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - if: inputs.install-deps == 'true'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev

    - shell: bash
      run: cmake -S Radicle -B build/radicle -G Ninja -DCMAKE_BUILD_TYPE=Debug -DRADICLE_BUILD_TESTS=ON

    - shell: bash
      run: cmake --build build/radicle

    - shell: bash
      run: ctest --test-dir build/radicle --output-on-failure
