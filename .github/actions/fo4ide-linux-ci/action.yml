name: fo4ide-linux-ci
description: Configure, build, and test PluginEditTool native (HTTP included) on Linux.

inputs:
  install-deps:
    description: 'Install ninja/zlib via apt first (hosted runners only)'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - if: inputs.install-deps == 'true'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev

    - shell: bash
      # HTTP stays ON so HttpServerTests (HTTP/SSE/RPC envelope) always run.
      run: >
        cmake -S PluginEditTool/native -B build/fo4ide -G Ninja
        -DCMAKE_BUILD_TYPE=Debug
        -DFO4IDE_BUILD_TESTS=ON

    - shell: bash
      run: cmake --build build/fo4ide

    - shell: bash
      run: ctest --test-dir build/fo4ide --output-on-failure
