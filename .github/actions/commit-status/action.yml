name: commit-status
description: Post a GitHub commit status against the PR head SHA (or the pushed SHA).

inputs:
  context:
    description: Status context string, e.g. native-ci/radicle-linux
    required: true
  state:
    description: pending | success | failure | error
    required: true
  description:
    description: Short human-readable description
    required: true
  token:
    description: GitHub token with statuses:write scope
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        STATUS_CONTEXT: ${{ inputs.context }}
        STATUS_STATE: ${{ inputs.state }}
        STATUS_DESCRIPTION: ${{ inputs.description }}
      # Under pull_request, GITHUB_SHA is an ephemeral merge commit that never
      # appears on any branch; branch protection evaluates the head SHA.
      run: |
        sha="${{ github.event.pull_request.head.sha || github.sha }}"
        curl -fsS -X POST \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${sha}" \
          -d "{\"state\":\"$STATUS_STATE\",\"context\":\"$STATUS_CONTEXT\",\"description\":\"$STATUS_DESCRIPTION\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
