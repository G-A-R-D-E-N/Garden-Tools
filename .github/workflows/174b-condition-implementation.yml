name: issue-174b-condition-implementation
on:
  push:
    branches:
      - work/174b-deferred-mutations
permissions:
  contents: write
jobs:
  implement-condition-deferred-save:
    runs-on: [self-hosted, Linux, X64, garden]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/174b-deferred-mutations
      - name: Load Ponytail rules
        run: |
          rm -rf /tmp/ponytail-174b-condition
          git clone --depth=1 https://github.com/DietrichGebert/ponytail.git /tmp/ponytail-174b-condition
          test -f /tmp/ponytail-174b-condition/AGENTS.md
      - name: Defer condition mutations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("PluginEditTool/native/src/plugin/RadiclePluginMutation.cpp")
          text = path.read_text()
          old = '''        fo4::write_plugin_file(mutated, loaded->path);\n        loaded->plugin = std::move(mutated);\n        {\n            std::error_code ec;\n            loaded->loadedTime = std::filesystem::last_write_time(loaded->path, ec);\n        }\n        rebuildGraphLocked();\n'''
          first = text.index("Result<nlohmann::json> RadiclePluginBackend::setConditions(")
          second = text.index("Result<nlohmann::json> RadiclePluginBackend::setConditionsAtPath(", first)
          third = text.index("Result<nlohmann::json> RadiclePluginBackend::setField(", second)
          first_segment = text[first:second]
          second_segment = text[second:third]
          if first_segment.count(old) != 1:
              raise SystemExit(f"expected one root condition write block, found {first_segment.count(old)}")
          if second_segment.count(old) != 1:
              raise SystemExit(f"expected one scoped condition write block, found {second_segment.count(old)}")
          first_segment = first_segment.replace(old, '''        stagePluginMutationLocked(*loaded, std::move(mutated));\n''', 1)
          second_segment = second_segment.replace(old, '''        stagePluginMutationLocked(*loaded, std::move(mutated));\n''', 1)
          path.write_text(text[:first] + first_segment + second_segment + text[third:])
          PY
          git diff --check
      - name: Build focused condition tests
        run: |
          cmake -S PluginEditTool/native -B build/fo4ide-174b-condition -G Ninja -DCMAKE_BUILD_TYPE=Debug -DFO4IDE_BUILD_TESTS=ON -DFO4IDE_BUILD_HTTP=OFF
          cmake --build build/fo4ide-174b-condition --target fo4ide_test_plugin_backend
      - name: Prove deferred condition persistence
        run: |
          for test in \
            "condition backend: SetConditions replaces the list and round-trips" \
            "condition backend: SetConditionsAt replaces one effect scope and round-trips" \
            "condition backend: SetConditionsAt clears one effect scope without touching siblings" \
            "Native SetField persists EDID and refreshes the record matrix"; do
            build/fo4ide-174b-condition/bin/fo4ide_test_plugin_backend "$test"
          done
      - name: Commit implementation
        run: |
          git rm .github/workflows/174b-condition-implementation.yml
          git config user.name "NomadsReach"
          git config user.email "144523850+NomadsReach@users.noreply.github.com"
          git add PluginEditTool/native/src/plugin/RadiclePluginMutation.cpp
          git commit -m "feat: defer condition persistence until SavePlugin"
          git push origin HEAD:work/174b-deferred-mutations
