name: issue-174b-red-bootstrap
on:
  push:
    branches:
      - work/174b-deferred-mutations
permissions:
  contents: write
jobs:
  prove-write-through:
    runs-on: [self-hosted, Linux, X64, garden]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/174b-deferred-mutations
      - name: Load Ponytail rules
        run: |
          rm -rf /tmp/ponytail-174b-red
          git clone --depth=1 https://github.com/DietrichGebert/ponytail.git /tmp/ponytail-174b-red
          test -f /tmp/ponytail-174b-red/AGENTS.md
      - name: Apply deferred FormLink RED contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"expected one match in {path}, found {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          list_path = "PluginEditTool/native/tests/unit/RadiclePluginFormLinkListTests.cpp"
          replace_once(
              list_path,
              '''    REQUIRE(result.has_value());\n\n    const auto disk = fo4::read_plugin_file(path);\n    const auto* race = fo4::find_record(\n        disk, fo4::FormKey::parse("000803:Patch.esp"));\n    REQUIRE(race != nullptr);\n    CHECK(nthRaw(*race, "AHCM", 0) == 0x00000800u);\n    CHECK(nthRaw(*race, "AHCM", 1) == 0x00000801u);\n}\n\nTEST_CASE("PluginEditTool inserts generated FormLink list element between neighbors")''',
              '''    REQUIRE(result.has_value());\n\n    const auto beforeSave = fo4::read_plugin_file(path);\n    const auto* beforeSaveRace = fo4::find_record(\n        beforeSave, fo4::FormKey::parse("000803:Patch.esp"));\n    REQUIRE(beforeSaveRace != nullptr);\n    CHECK(nthRaw(*beforeSaveRace, "AHCM", 0) == 0x00000800u);\n    CHECK(nthRaw(*beforeSaveRace, "AHCM", 1) == 0x00000800u);\n\n    REQUIRE(backend.invoke(\n        "backend.SavePlugin", nlohmann::json::array({"Patch.esp"})).has_value());\n    const auto disk = fo4::read_plugin_file(path);\n    const auto* race = fo4::find_record(\n        disk, fo4::FormKey::parse("000803:Patch.esp"));\n    REQUIRE(race != nullptr);\n    CHECK(nthRaw(*race, "AHCM", 0) == 0x00000800u);\n    CHECK(nthRaw(*race, "AHCM", 1) == 0x00000801u);\n}\n\nTEST_CASE("PluginEditTool inserts generated FormLink list element between neighbors")'''
          )

          proj_path = "PluginEditTool/native/tests/unit/RadiclePluginProjExplHazdTests.cpp"
          replace_once(
              proj_path,
              '''    REQUIRE(backend.setFieldValue(nlohmann::json::array({\n        "Patch.esp", key.to_string(), "PROJ\\\\Light", "NULL"\n    })).has_value());\n    const auto cleared = fo4::read_plugin_file(path);\n''',
              '''    REQUIRE(backend.setFieldValue(nlohmann::json::array({\n        "Patch.esp", key.to_string(), "PROJ\\\\Light", "NULL"\n    })).has_value());\n    const auto beforeClearSave = fo4::read_plugin_file(path);\n    CHECK(fo4::forms::decode_projectile(beforeClearSave, key).light ==\n          fo4::FormKey::parse("000800:Patch.esp"));\n\n    REQUIRE(backend.invoke(\n        "backend.SavePlugin", nlohmann::json::array({"Patch.esp"})).has_value());\n    const auto cleared = fo4::read_plugin_file(path);\n'''
          )
          replace_once(
              proj_path,
              '''    REQUIRE(backend.setFieldValue(nlohmann::json::array({\n        "Patch.esp", key.to_string(), "PROJ\\\\Light", "000800:Patch.esp"\n    })).has_value());\n    const auto after = fo4::read_plugin_file(path);\n''',
              '''    REQUIRE(backend.setFieldValue(nlohmann::json::array({\n        "Patch.esp", key.to_string(), "PROJ\\\\Light", "000800:Patch.esp"\n    })).has_value());\n    REQUIRE(backend.invoke(\n        "backend.SavePlugin", nlohmann::json::array({"Patch.esp"})).has_value());\n    const auto after = fo4::read_plugin_file(path);\n'''
          )
          PY
          git diff --check
      - name: Build focused backend tests
        run: |
          cmake -S PluginEditTool/native -B build/fo4ide-174b-red -G Ninja -DCMAKE_BUILD_TYPE=Debug -DFO4IDE_BUILD_TESTS=ON -DFO4IDE_BUILD_HTTP=OFF
          cmake --build build/fo4ide-174b-red --target fo4ide_test_plugin_backend fo4ide_test_proj_expl_hazd
      - name: Prove current paths are write-through
        run: |
          set +e
          build/fo4ide-174b-red/bin/fo4ide_test_plugin_backend "PluginEditTool edits generated indexed RACE FormLink list field" > /tmp/list-red.txt 2>&1
          list_status=$?
          build/fo4ide-174b-red/bin/fo4ide_test_proj_expl_hazd "Native PROJ FormLink SetField preserves neighbors*" > /tmp/proj-red.txt 2>&1
          proj_status=$?
          set -e
          cat /tmp/list-red.txt
          cat /tmp/proj-red.txt
          test "$list_status" -ne 0
          test "$proj_status" -ne 0
          grep -F '0x801' /tmp/list-red.txt
          grep -F 'FAILED:' /tmp/proj-red.txt
      - name: Commit RED proof
        run: |
          git rm .github/workflows/174b-red-bootstrap.yml
          git config user.name "NomadsReach"
          git config user.email "144523850+NomadsReach@users.noreply.github.com"
          git add PluginEditTool/native/tests/unit/RadiclePluginFormLinkListTests.cpp PluginEditTool/native/tests/unit/RadiclePluginProjExplHazdTests.cpp
          git commit -m "test: prove deferred FormLink persistence contract"
          git push origin HEAD:work/174b-deferred-mutations
