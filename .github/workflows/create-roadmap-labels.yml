name: Create roadmap labels

on:
  push:
    branches:
      - native-m1-foundation
    paths:
      - .github/workflows/create-roadmap-labels.yml

permissions:
  contents: read
  issues: write

jobs:
  labels:
    name: Create roadmap labels
    runs-on: ubuntu-latest
    steps:
      - name: Create or update labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh label create "roadmap" --repo "$GH_REPO" --color "0052CC" --description "Tracked by the active project roadmap" --force
          gh label create "native-cpp" --repo "$GH_REPO" --color "0969DA" --description "Part of or constrained by the native C++ rewrite" --force
          gh label create "path:native-runtime" --repo "$GH_REPO" --color "1D76DB" --description "Native host, platform, environment, transport, and tool services" --force
          gh label create "path:plugin-core" --repo "$GH_REPO" --color "5319E7" --description "Native plugin parser, writer, schema, indexing, conflicts, and authoring" --force
          gh label create "path:ck-re" --repo "$GH_REPO" --color "B60205" --description "Creation Kit reverse engineering and world-generation parity" --force
          gh label create "path:papyrus" --repo "$GH_REPO" --color "D4C5F9" --description "Papyrus compiler, decompiler, PEX, and fidelity work" --force
          gh label create "path:ui-workflow" --repo "$GH_REPO" --color "0E8A16" --description "React UI, xEdit workflow parity, and user-facing editors" --force
          gh label create "path:ecosystem" --repo "$GH_REPO" --color "C2E0C6" --description "External integrations, diagnostics, Nexus, F4SE, and ecosystem tooling" --force
          gh label create "status:active" --repo "$GH_REPO" --color "0E8A16" --description "On the current rewrite critical path or actively actionable" --force
          gh label create "status:blocked" --repo "$GH_REPO" --color "B60205" --description "Blocked on a prerequisite or verified research result" --force
          gh label create "status:deferred" --repo "$GH_REPO" --color "FBCA04" --description "Valid backlog item intentionally deferred behind higher-priority work" --force
          gh label create "status:rewrite-acceptance" --repo "$GH_REPO" --color "D4C5F9" --description "Existing gap retained as an acceptance requirement for the native backend" --force
          gh label create "status:sidecar" --repo "$GH_REPO" --color "7057FF" --description "Preserve current implementation behind the native host until a later migration phase" --force
