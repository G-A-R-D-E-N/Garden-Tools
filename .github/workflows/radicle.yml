name: Radicle + PluginEditTool Native

# Self-hosted only -- see native-ci.yml's header for why (private repo, no
# untrusted-fork threat, and hosted runners fail outright: GHRUNNER#24).
# "Install native dependencies" is gone: it ran `sudo apt-get`, which the
# self-hosted runner account cannot do (self-hosted runner accounts are
# deliberately non-privileged -- GHRUNNER's own security policy), and the
# toolchain (ninja, zlib1g-dev) is already staged host-wide on this runner.

on:
  push:
    paths:
      - 'Radicle/**'
      - 'PluginEditTool/native/**'
      - '.github/workflows/radicle.yml'
  pull_request:
    paths:
      - 'Radicle/**'
      - 'PluginEditTool/native/**'
      - '.github/workflows/radicle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  radicle:
    runs-on: [self-hosted, Linux, X64, garden]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure Radicle
        run: >-
          cmake -S Radicle -B build/radicle -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DRADICLE_BUILD_TESTS=ON
          -DRADICLE_BUILD_TOOLS=ON

      - name: Build Radicle
        run: cmake --build build/radicle --parallel

      - name: Test Radicle
        run: ctest --test-dir build/radicle --output-on-failure

  plugin-edit-native:
    runs-on: [self-hosted, Linux, X64, garden]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure PluginEditTool native host
        # HTTP stays ON so the HttpServerTests (HTTP/SSE/RPC envelope) run.
        run: >-
          cmake -S PluginEditTool/native -B build/plugin-edit-native -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DFO4IDE_BUILD_TESTS=ON

      - name: Build PluginEditTool native host
        run: cmake --build build/plugin-edit-native --parallel

      - name: Test PluginEditTool native host
        run: ctest --test-dir build/plugin-edit-native --output-on-failure
