name: issue-174b-generic-implementation
on:
  push:
    branches:
      - work/174b-deferred-mutations
permissions:
  contents: write
jobs:
  implement-generic-deferred-save:
    runs-on: [self-hosted, Linux, X64, garden]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/174b-deferred-mutations
      - name: Load Ponytail rules
        run: |
          rm -rf /tmp/ponytail-174b-generic
          git clone --depth=1 https://github.com/DietrichGebert/ponytail.git /tmp/ponytail-174b-generic
          test -f /tmp/ponytail-174b-generic/AGENTS.md
      - name: Defer generic mutations
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"expected one match in {path}, found {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          mutation = Path("PluginEditTool/native/src/plugin/RadiclePluginMutation.cpp")
          text = mutation.read_text()
          start = text.index("Result<nlohmann::json> RadiclePluginBackend::setField(")
          end = text.index("Result<nlohmann::json> RadiclePluginBackend::copyAsOverride(", start)
          segment = text[start:end]
          old = '''        fo4::write_plugin_file(mutated, loaded->path);\n        loaded->plugin = std::move(mutated);\n        {\n            std::error_code ec;\n            loaded->loadedTime = std::filesystem::last_write_time(loaded->path, ec);\n        }\n        rebuildGraphLocked();\n'''
          if segment.count(old) != 1:
              raise SystemExit(f"expected one generic setField write block, found {segment.count(old)}")
          segment = segment.replace(old, '''        stagePluginMutationLocked(*loaded, std::move(mutated));\n''', 1)
          mutation.write_text(text[:start] + segment + text[end:])

          replace_once(
              "PluginEditTool/native/src/plugin/RadiclePluginArmor.cpp",
              '''        fo4::write_plugin_file(mutated, loaded->path);\n        loaded->plugin = std::move(mutated);\n        {\n            std::error_code ec;\n            loaded->loadedTime = std::filesystem::last_write_time(loaded->path, ec);\n        }\n        rebuildGraphLocked();\n''',
              '''        stagePluginMutationLocked(*loaded, std::move(mutated));\n'''
          )

          replace_once(
              "PluginEditTool/native/src/plugin/RadiclePluginComponents.cpp",
              '''        fo4::write_plugin_file(mutated, loaded->path);\n        loaded->plugin = std::move(mutated);\n        {\n            std::error_code ec;\n            loaded->loadedTime = std::filesystem::last_write_time(loaded->path, ec);\n        }\n        rebuildGraphLocked();\n''',
              '''        stagePluginMutationLocked(*loaded, std::move(mutated));\n'''
          )

          element = Path("PluginEditTool/native/src/plugin/RadiclePluginElement.cpp")
          text = element.read_text()
          old = '''        fo4::write_plugin_file(mutated, loaded->path);\n        loaded->plugin = std::move(mutated);\n        std::error_code ec;\n        loaded->loadedTime = std::filesystem::last_write_time(loaded->path, ec);\n        rebuildGraphLocked();\n'''
          if text.count(old) != 4:
              raise SystemExit(f"expected four element write blocks, found {text.count(old)}")
          element.write_text(text.replace(old, '''        stagePluginMutationLocked(*loaded, std::move(mutated));\n'''))
          PY
          git diff --check
      - name: Build focused generic tests
        run: |
          cmake -S PluginEditTool/native -B build/fo4ide-174b-generic -G Ninja -DCMAKE_BUILD_TYPE=Debug -DFO4IDE_BUILD_TESTS=ON -DFO4IDE_BUILD_HTTP=OFF
          cmake --build build/fo4ide-174b-generic --target fo4ide_test_plugin_backend
      - name: Prove deferred generic persistence
        run: |
          for test in \
            "Native SetField persists EDID and refreshes the record matrix" \
            "PluginEditTool fills missing ARMO gendered fields after creation" \
            "PluginEditTool set_components writes CVPA and identity CDIX on a MISC" \
            "Native ElementService handles the current raw conflict-matrix FormLink path" \
            "Native schema SetField defers REFR XHLT persistence until SavePlugin" \
            "PluginEditTool inserts generated FormLink list element between neighbors"; do
            build/fo4ide-174b-generic/bin/fo4ide_test_plugin_backend "$test"
          done
      - name: Commit implementation
        run: |
          git rm .github/workflows/174b-generic-implementation.yml
          git config user.name "NomadsReach"
          git config user.email "144523850+NomadsReach@users.noreply.github.com"
          git add PluginEditTool/native/src/plugin/RadiclePluginMutation.cpp PluginEditTool/native/src/plugin/RadiclePluginArmor.cpp PluginEditTool/native/src/plugin/RadiclePluginComponents.cpp PluginEditTool/native/src/plugin/RadiclePluginElement.cpp
          git commit -m "feat: defer generic mutation persistence until SavePlugin"
          git push origin HEAD:work/174b-deferred-mutations
