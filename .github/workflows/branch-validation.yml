name: Branch validation

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-core-and-web:
    name: Portable core, server, and web
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Run web tests
        working-directory: web
        run: npm test

      - name: Build web bundle
        working-directory: web
        run: npm run build

      - name: Restore portable test project
        run: dotnet restore FO4RecordEditor.Core.Tests/FO4RecordEditor.Core.Tests.csproj

      - name: Build portable test project
        run: dotnet build FO4RecordEditor.Core.Tests/FO4RecordEditor.Core.Tests.csproj --configuration Release --no-restore

      - name: Run portable test suite
        run: dotnet test FO4RecordEditor.Core.Tests/FO4RecordEditor.Core.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Build cross-platform server
        run: dotnet build FO4RecordEditor.Server/FO4RecordEditor.Server.csproj --configuration Release

      # Compile gate for the Windows test project. The WPF SDK targets remove System.IO from
      # implicit usings, so test files relying on it fail to compile even though the code reads
      # fine; the full suite only builds+runs on the Windows job, so gate compilation here on the
      # cheap job to catch uncompilable merged test files in minutes instead of on the Windows
      # runner. EnableWindowsTargeting lets net9.0-windows compile on ubuntu; it only compiles,
      # it does not run (the suite references WPF and needs the Windows testhost).
      - name: Restore Windows test project (compile gate)
        run: dotnet restore FO4RecordEditor.Tests/FO4RecordEditor.Tests.csproj -p:EnableWindowsTargeting=true

      - name: Compile Windows test project (compile gate)
        run: dotnet build FO4RecordEditor.Tests/FO4RecordEditor.Tests.csproj --configuration Release --no-restore -p:EnableWindowsTargeting=true

  windows-shell-and-tests:
    name: Windows shell and integration tests
    # The compile leg runs on the org's self-hosted debian-wine-msvc runner (Linux/X64, wine+msvc
    # labels) so Windows-targeted builds cost no cloud minutes; EnableWindowsTargeting compiles
    # the net9.0-windows projects on Linux. Executing the WPF suite under Wine is NOT CI-reliable
    # (vstest hangs, native stack overflows in process-spawning tests, order-dependent CPU spins
    # in Mutagen static state), so the suite itself RUNS on windows-latest.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: compile-on-selfhosted
            runner: [self-hosted, Linux, X64, wine, msvc]
            run_tests: false
          - name: run-on-windows
            runner: [windows-latest]
            run_tests: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Build web bundle for desktop output
        working-directory: web
        run: npm run build

      - name: Restore Windows test project
        run: dotnet restore FO4RecordEditor.Tests/FO4RecordEditor.Tests.csproj -p:EnableWindowsTargeting=true

      - name: Build Windows shell and test project
        run: dotnet build FO4RecordEditor.Tests/FO4RecordEditor.Tests.csproj --configuration Release --no-restore -p:EnableWindowsTargeting=true

      - name: Run Windows integration test suite
        if: matrix.run_tests
        run: dotnet test FO4RecordEditor.Tests/FO4RecordEditor.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal"
