name: bgs-ci


on:
  push:
    branches:
      - main
    paths:
      - "BGS/**"
      - ".github/workflows/bgs-ci.yml"
  pull_request:
    paths:
      - "BGS/**"
      - ".github/workflows/bgs-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes a pull request or branch run, but main runs always
# finish: cancelling them on every merge left main itself untested.
concurrency:
  group: bgs-ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: BGS build and test (${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      BUILD_COMMIT: ${{ github.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: [self-hosted, Linux, X64, garden]
            rid: linux-x64
            shell: bash
            python: python3
          - runner: [self-hosted, Windows, X64]
            rid: win-x64
            shell: cmd
            python: python
    defaults:
      run:
        shell: ${{ matrix.shell }}
        working-directory: BGS
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # The runner's tool cache persists between jobs, so the pinned SDK is
      # downloaded once per runner host instead of on every run.
      - name: Set up pinned .NET SDK
        uses: https://github.com/actions/setup-dotnet@v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet-8.0.424
        with:
          dotnet-version: 8.0.424

      - name: Restore BehaviourGraph.Core
        run: dotnet restore src/BehaviourGraph.Core.csproj --locked-mode

      - name: Restore BehaviourStudio
        run: dotnet restore app/BehaviourStudio.csproj --locked-mode

      - name: Restore symrm
        run: dotnet restore tools/symrm/symrm.csproj --locked-mode

      - name: Restore tests
        run: dotnet restore tools/tests/BehaviourGraph.Tests.csproj --locked-mode

      - name: Restore uismoke
        run: dotnet restore tools/uismoke/uismoke.csproj --locked-mode

      - name: Restore MCP host
        run: dotnet restore tools/mcp/BehaviourGraph.Mcp.csproj --locked-mode

      - name: Build MCP host
        run: dotnet build tools/mcp/BehaviourGraph.Mcp.csproj --configuration Release --no-restore

      - name: Build app
        run: dotnet build app/BehaviourStudio.csproj --configuration Release --no-restore

      - name: Run native regression harness
        run: dotnet run --project tools/symrm/symrm.csproj --configuration Release --no-restore -- test

      - name: Run xUnit suite
        run: dotnet test tools/tests/BehaviourGraph.Tests.csproj --configuration Release --no-restore --logger "console;verbosity=normal"

      - name: Run UI smoke harness
        run: dotnet run --project tools/uismoke/uismoke.csproj --configuration Release --no-restore

      - name: Run assistant smoke
        run: dotnet run --project tools/uismoke/uismoke.csproj --configuration Release --no-build -- --assistant

      - name: Run multi-chat smoke
        run: dotnet run --project tools/uismoke/uismoke.csproj --configuration Release --no-build -- --multichat

      - name: Run workspace layout smoke
        run: dotnet run --project tools/uismoke/uismoke.csproj --configuration Release --no-build -- --layout-smoke

      - name: Run rig authoring and physics smoke
        run: dotnet run --project tools/uismoke/uismoke.csproj --configuration Release --no-build -- --rig-authoring

      - name: Publish platform package
        run: >
          dotnet publish app/BehaviourStudio.csproj --configuration Release
          --runtime ${{ matrix.rid }} --self-contained true --no-restore
          --output publish-check -p:DebugType=none -p:DebugSymbols=false
          -p:BuildCommit=${{ env.BUILD_COMMIT }}

      - name: Verify package identity and remove symbols
        run: >
          ${{ matrix.python }} tools/ci/package.py publish-check
          --commit ${{ env.BUILD_COMMIT }} --runtime ${{ matrix.rid }}
