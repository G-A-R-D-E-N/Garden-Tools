name: issue-174b-core-writers

on:
  push:
    branches:
      - work/174b-deferred-mutations

permissions:
  contents: write

jobs:
  prove-final-writers-green:
    runs-on: [self-hosted, Linux, X64, garden]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/174b-deferred-mutations
          submodules: recursive
          fetch-depth: 0
      - name: Prove and commit remaining writer GREEN
        run: |
          sed -i 's/old = '\''        message += \\" Written to disk.\\";\\n'\''/old = '\''    message += \\" Written to disk.\\";\\n'\''/' .github/174b-final-writers-green.sh
          sed -i 's/new = '\''        message += \\" SavePlugin to persist.\\";\\n'\''/new = '\''    message += \\" SavePlugin to persist.\\";\\n'\''/' .github/174b-final-writers-green.sh
          bash .github/174b-final-writers-green.sh
