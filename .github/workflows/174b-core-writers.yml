name: issue-174b-core-writers
on:
  push:
    branches:
      - work/174b-deferred-mutations
permissions:
  contents: write
jobs:
  prove-and-implement-core-writers:
    runs-on: [self-hosted, Linux, X64, garden]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/174b-deferred-mutations
      - name: Load Ponytail rules
        run: |
          rm -rf /tmp/ponytail-174b-core
          git clone --depth=1 https://github.com/DietrichGebert/ponytail.git /tmp/ponytail-174b-core
          test -f /tmp/ponytail-174b-core/AGENTS.md
      - name: Apply core-writer RED contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"expected one match in {path}, found {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          masters = "PluginEditTool/native/tests/unit/RadiclePluginAddMastersTests.cpp"
          replace_once(
              masters,
              '''    const auto reloaded = fo4::read_plugin_file(targetPath);\n    REQUIRE(reloaded.header.masters.size() == 1);\n    CHECK(reloaded.header.masters[0].key.filename() == "Master.esm");\n    CHECK(reloaded.header.masters[0].kind == fo4::PluginKind::full);\n\n    const auto* local = fo4::find_record(\n        reloaded, fo4::FormKey::parse("000810:Target.esp"));\n    REQUIRE(local != nullptr);\n    CHECK(local->header.form_id == fo4::RawFormId{0x01000810});\n''',
              '''    const auto listedRaw = backend.invoke(\n        "masters.List", nlohmann::json::array({"Target.esp"}));\n    REQUIRE(listedRaw.has_value());\n    const auto listed = nlohmann::json::parse(listedRaw->get<std::string>());\n    REQUIRE(listed.at("masters").size() == 1);\n    CHECK(listed.at("masters")[0].at("name") == "Master.esm");\n\n    const auto beforeSave = fo4::read_plugin_file(targetPath);\n    CHECK(beforeSave.header.masters.empty());\n\n    REQUIRE(backend.invoke(\n        "backend.SavePlugin", nlohmann::json::array({"Target.esp"})).has_value());\n    const auto reloaded = fo4::read_plugin_file(targetPath);\n    REQUIRE(reloaded.header.masters.size() == 1);\n    CHECK(reloaded.header.masters[0].key.filename() == "Master.esm");\n    CHECK(reloaded.header.masters[0].kind == fo4::PluginKind::full);\n\n    const auto* local = fo4::find_record(\n        reloaded, fo4::FormKey::parse("000810:Target.esp"));\n    REQUIRE(local != nullptr);\n    CHECK(local->header.form_id == fo4::RawFormId{0x01000810});\n'''
          )

          maintenance = "PluginEditTool/native/tests/unit/RadiclePluginMaintenanceTests.cpp"
          replace_once(
              maintenance,
              '''    const auto disk = fo4::read_plugin_file(path);\n    const auto* record = fo4::find_record(\n        disk, fo4::FormKey::parse("000800:Patch.esp"));\n    REQUIRE(record != nullptr);\n    CHECK_FALSE(record->header.flags.is_deleted());\n    CHECK((record->header.flags.value() & 0x00000800u) != 0u);\n''',
              '''    const auto beforeSave = fo4::read_plugin_file(path);\n    const auto* beforeRecord = fo4::find_record(\n        beforeSave, fo4::FormKey::parse("000800:Patch.esp"));\n    REQUIRE(beforeRecord != nullptr);\n    CHECK(beforeRecord->header.flags.is_deleted());\n\n    REQUIRE(backend.invoke(\n        "backend.SavePlugin", nlohmann::json::array({"Patch.esp"})).has_value());\n    const auto disk = fo4::read_plugin_file(path);\n    const auto* record = fo4::find_record(\n        disk, fo4::FormKey::parse("000800:Patch.esp"));\n    REQUIRE(record != nullptr);\n    CHECK_FALSE(record->header.flags.is_deleted());\n    CHECK((record->header.flags.value() & 0x00000800u) != 0u);\n'''
          )
          replace_once(
              maintenance,
              '''    const auto patch = fo4::read_plugin_file(patchPath);\n    CHECK(fo4::find_record(\n        patch, fo4::FormKey::parse("000800:Base.esm")) == nullptr);\n\n    const auto base = fo4::read_plugin_file(basePath);\n''',
              '''    const auto beforeSave = fo4::read_plugin_file(patchPath);\n    CHECK(fo4::find_record(\n        beforeSave, fo4::FormKey::parse("000800:Base.esm")) != nullptr);\n\n    REQUIRE(backend.invoke(\n        "backend.SavePlugin", nlohmann::json::array({"Patch.esp"})).has_value());\n    const auto patch = fo4::read_plugin_file(patchPath);\n    CHECK(fo4::find_record(\n        patch, fo4::FormKey::parse("000800:Base.esm")) == nullptr);\n\n    const auto base = fo4::read_plugin_file(basePath);\n'''
          )
          replace_once(
              maintenance,
              '''    const auto patch = fo4::read_plugin_file(patchPath);\n    REQUIRE(patch.header.masters.size() == 1);\n    CHECK(patch.header.masters[0].key.filename() == "Base.esm");\n    CHECK(patch.header.next_form_id == 0x801u);\n\n    const auto* duplicate = fo4::find_record(\n        patch, fo4::FormKey::parse("000800:Patch.esp"));\n    REQUIRE(duplicate != nullptr);\n    CHECK(duplicate->header.signature == fo4::Signature::from_string("RACE"));\n    CHECK(editorId(*duplicate) == "SourceRaceDUP");\n    CHECK(rawSubrecord(*duplicate, "AHCM") == 0x00000800u);\n''',
              '''    const auto beforeSave = fo4::read_plugin_file(patchPath);\n    CHECK(beforeSave.header.masters.empty());\n    CHECK(beforeSave.header.next_form_id == 0x800u);\n    CHECK(fo4::find_record(\n        beforeSave, fo4::FormKey::parse("000800:Patch.esp")) == nullptr);\n\n    REQUIRE(backend.invoke(\n        "backend.SavePlugin", nlohmann::json::array({"Patch.esp"})).has_value());\n    const auto patch = fo4::read_plugin_file(patchPath);\n    REQUIRE(patch.header.masters.size() == 1);\n    CHECK(patch.header.masters[0].key.filename() == "Base.esm");\n    CHECK(patch.header.next_form_id == 0x801u);\n\n    const auto* duplicate = fo4::find_record(\n        patch, fo4::FormKey::parse("000800:Patch.esp"));\n    REQUIRE(duplicate != nullptr);\n    CHECK(duplicate->header.signature == fo4::Signature::from_string("RACE"));\n    CHECK(editorId(*duplicate) == "SourceRaceDUP");\n    CHECK(rawSubrecord(*duplicate, "AHCM") == 0x00000800u);\n'''
          )
          replace_once(
              maintenance,
              '''    const auto disk = fo4::read_plugin_file(path);\n    CHECK(fo4::find_record(\n        disk, fo4::FormKey::parse("001000:Patch.esp")) == nullptr);\n    const auto* color = fo4::find_record(\n        disk, fo4::FormKey::parse("000801:Patch.esp"));\n    REQUIRE(color != nullptr);\n    CHECK(editorId(*color) == "HighColor");\n\n    const auto* race = fo4::find_record(\n        disk, fo4::FormKey::parse("000800:Patch.esp"));\n    REQUIRE(race != nullptr);\n    CHECK(rawSubrecord(*race, "AHCM") == 0x00000801u);\n''',
              '''    const auto beforeSave = fo4::read_plugin_file(path);\n    CHECK(fo4::find_record(\n        beforeSave, fo4::FormKey::parse("001000:Patch.esp")) != nullptr);\n    CHECK(fo4::find_record(\n        beforeSave, fo4::FormKey::parse("000801:Patch.esp")) == nullptr);\n\n    REQUIRE(backend.invoke(\n        "backend.SavePlugin", nlohmann::json::array({"Patch.esp"})).has_value());\n    const auto disk = fo4::read_plugin_file(path);\n    CHECK(fo4::find_record(\n        disk, fo4::FormKey::parse("001000:Patch.esp")) == nullptr);\n    const auto* color = fo4::find_record(\n        disk, fo4::FormKey::parse("000801:Patch.esp"));\n    REQUIRE(color != nullptr);\n    CHECK(editorId(*color) == "HighColor");\n\n    const auto* race = fo4::find_record(\n        disk, fo4::FormKey::parse("000800:Patch.esp"));\n    REQUIRE(race != nullptr);\n    CHECK(rawSubrecord(*race, "AHCM") == 0x00000801u);\n'''
          )
          replace_once(
              maintenance,
              '''    const auto patch = fo4::read_plugin_file(patchPath);\n    const auto* duplicate = fo4::find_record(patch, fo4::FormKey::parse("000900:Patch.esp"));\n    REQUIRE(duplicate != nullptr);\n    CHECK(duplicate->header.signature == fo4::Signature::from_string("REFR"));\n    CHECK(editorId(*duplicate) == "SourceRefDUP");\n    const auto* sourceCell = fo4::find_record(patch, fo4::FormKey::parse("000800:Base.esm"));\n    REQUIRE(sourceCell != nullptr);\n    CHECK(sourceCell->header.signature == fo4::Signature::from_string("CELL"));\n''',
              '''    const auto beforeSave = fo4::read_plugin_file(patchPath);\n    CHECK(fo4::find_record(\n        beforeSave, fo4::FormKey::parse("000900:Patch.esp")) == nullptr);\n    REQUIRE(fo4::find_record(\n        beforeSave, fo4::FormKey::parse("000800:Base.esm")) != nullptr);\n\n    REQUIRE(backend.invoke(\n        "backend.SavePlugin", nlohmann::json::array({"Patch.esp"})).has_value());\n    const auto patch = fo4::read_plugin_file(patchPath);\n    const auto* duplicate = fo4::find_record(patch, fo4::FormKey::parse("000900:Patch.esp"));\n    REQUIRE(duplicate != nullptr);\n    CHECK(duplicate->header.signature == fo4::Signature::from_string("REFR"));\n    CHECK(editorId(*duplicate) == "SourceRefDUP");\n    const auto* sourceCell = fo4::find_record(patch, fo4::FormKey::parse("000800:Base.esm"));\n    REQUIRE(sourceCell != nullptr);\n    CHECK(sourceCell->header.signature == fo4::Signature::from_string("CELL"));\n'''
          )

          cell = "PluginEditTool/native/tests/unit/RadiclePluginCellTests.cpp"
          replace_once(
              cell,
              '''    const auto reread = fo4::read_plugin_file(patchPath);\n    REQUIRE(reread.header.masters.size() == 2);\n    CHECK(reread.header.masters[0].key.filename() == "Other.esm");\n    CHECK(reread.header.masters[1].key.filename() == "Base.esm");\n\n    const auto cellKey = fo4::FormKey::parse("000800:Base.esm");\n    const auto referenceKey = fo4::FormKey::parse("000801:Base.esm");\n    REQUIRE(fo4::find_record(reread, cellKey) != nullptr);\n    REQUIRE(fo4::find_record(reread, referenceKey) != nullptr);\n\n    const auto refs = fo4::forms::placed_references_for_cell(reread, cellKey);\n''',
              '''    const auto pendingView = parseStringResult(\n        backend.getPlacedReferences(nlohmann::json::array({"000800:Base.esm"})));\n    REQUIRE(pendingView.at("references").size() == 1);\n    CHECK(pendingView.at("references")[0].at("position").at("x") == 100.0f);\n\n    const auto beforeSave = fo4::read_plugin_file(patchPath);\n    REQUIRE(beforeSave.header.masters.size() == 1);\n    CHECK(beforeSave.header.masters[0].key.filename() == "Other.esm");\n    CHECK(fo4::find_record(\n        beforeSave, fo4::FormKey::parse("000800:Base.esm")) == nullptr);\n    CHECK(fo4::find_record(\n        beforeSave, fo4::FormKey::parse("000801:Base.esm")) == nullptr);\n\n    REQUIRE(backend.invoke(\n        "backend.SavePlugin", nlohmann::json::array({"Patch.esp"})).has_value());\n    const auto reread = fo4::read_plugin_file(patchPath);\n    REQUIRE(reread.header.masters.size() == 2);\n    CHECK(reread.header.masters[0].key.filename() == "Other.esm");\n    CHECK(reread.header.masters[1].key.filename() == "Base.esm");\n\n    const auto cellKey = fo4::FormKey::parse("000800:Base.esm");\n    const auto referenceKey = fo4::FormKey::parse("000801:Base.esm");\n    REQUIRE(fo4::find_record(reread, cellKey) != nullptr);\n    REQUIRE(fo4::find_record(reread, referenceKey) != nullptr);\n\n    const auto refs = fo4::forms::placed_references_for_cell(reread, cellKey);\n'''
          )
          PY
          git diff --check
      - name: Build RED contracts
        run: |
          cmake -S PluginEditTool/native -B build/fo4ide-174b-core -G Ninja -DCMAKE_BUILD_TYPE=Debug -DFO4IDE_BUILD_TESTS=ON -DFO4IDE_BUILD_HTTP=OFF
          cmake --build build/fo4ide-174b-core --target fo4ide_test_plugin_backend
      - name: Prove remaining core writers write through
        run: |
          set +e
          for test in \
            "Native AddMasters appends loaded master and preserves target FormKey" \
            "Native CleanPlugin undeletes and initially disables records on disk" \
            "Native RemoveIdenticalToMaster previews and removes top-level ITM overrides" \
            "Native CopyAsNewRecord allocates a local record and remaps source FormLinks" \
            "Native CompactToEsl remaps top-level records and their in-plugin references" \
            "Native CopyAsNewRecord duplicates a contained REFR into an existing target CELL" \
            "Native cell transform creates a nested override before moving the reference"; do
            build/fo4ide-174b-core/bin/fo4ide_test_plugin_backend "$test" > /tmp/core-red.txt 2>&1
            status=$?
            cat /tmp/core-red.txt
            test "$status" -ne 0 || exit 1
            grep -F 'FAILED:' /tmp/core-red.txt || exit 1
          done
          set -e
      - name: Commit core-writer RED proof
        run: |
          git rm .github/workflows/174b-core-writers.yml
          git config user.name "NomadsReach"
          git config user.email "144523850+NomadsReach@users.noreply.github.com"
          git add PluginEditTool/native/tests/unit/RadiclePluginAddMastersTests.cpp PluginEditTool/native/tests/unit/RadiclePluginMaintenanceTests.cpp PluginEditTool/native/tests/unit/RadiclePluginCellTests.cpp
          git commit -m "test: prove deferred core writer contract"
          git push origin HEAD:work/174b-deferred-mutations
      - name: Defer remaining core writers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          master = Path("PluginEditTool/native/src/plugin/RadiclePluginMasterMutation.cpp")
          text = master.read_text()
          old = '''        fo4::write_plugin_file(mutated, target->path);\n        target->plugin = std::move(mutated);\n        {\n            std::error_code ec;\n            target->loadedTime = std::filesystem::last_write_time(target->path, ec);\n        }\n        rebuildGraphLocked();\n'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one AddMasters tail, found {text.count(old)}")
          master.write_text(text.replace(old, '''        stagePluginMutationLocked(*target, std::move(mutated));\n''', 1))

          compact = Path("PluginEditTool/native/src/plugin/RadiclePluginCompact.cpp")
          text = compact.read_text()
          old = '''        fo4::write_plugin_file(mutated, loaded->path);\n        loaded->plugin = std::move(mutated);\n        std::error_code ec;\n        loaded->loadedTime = std::filesystem::last_write_time(loaded->path, ec);\n        rebuildGraphLocked();\n'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one compact tail, found {text.count(old)}")
          compact.write_text(text.replace(old, '''        stagePluginMutationLocked(*loaded, std::move(mutated));\n''', 1))

          cell = Path("PluginEditTool/native/src/plugin/RadiclePluginCell.cpp")
          text = cell.read_text()
          old = '''        fo4::write_plugin_file(mutated, patch->path);\n        patch->plugin = std::move(mutated);\n        {\n            std::error_code ec;\n            patch->loadedTime = std::filesystem::last_write_time(patch->path, ec);\n        }\n        rebuildGraphLocked();\n'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one cell transform tail, found {text.count(old)}")
          cell.write_text(text.replace(old, '''        stagePluginMutationLocked(*patch, std::move(mutated));\n''', 1))

          maintenance = Path("PluginEditTool/native/src/plugin/RadiclePluginMaintenance.cpp")
          text = maintenance.read_text()
          target_tail = '''                fo4::write_plugin_file(mutated, target->path);\n                target->plugin = std::move(mutated);\n                std::error_code ec;\n                target->loadedTime = std::filesystem::last_write_time(target->path, ec);\n                rebuildGraphLocked();\n'''
          if text.count(target_tail) != 1:
              raise SystemExit(f"expected one indented nested CopyAsNew tail, found {text.count(target_tail)}")
          text = text.replace(target_tail, '''                stagePluginMutationLocked(*target, std::move(mutated));\n''', 1)
          target_tail = '''            fo4::write_plugin_file(mutated, target->path);\n            target->plugin = std::move(mutated);\n            std::error_code ec;\n            target->loadedTime = std::filesystem::last_write_time(target->path, ec);\n            rebuildGraphLocked();\n'''
          if text.count(target_tail) != 1:
              raise SystemExit(f"expected one top-level CopyAsNew tail, found {text.count(target_tail)}")
          text = text.replace(target_tail, '''            stagePluginMutationLocked(*target, std::move(mutated));\n''', 1)
          clean = '''            mutated.original_range.clear();\n            fo4::write_plugin_file(mutated, loaded->path);\n            loaded->plugin = std::move(mutated);\n            std::error_code ec;\n            loaded->loadedTime = std::filesystem::last_write_time(loaded->path, ec);\n            rebuildGraphLocked();\n'''
          if text.count(clean) != 1:
              raise SystemExit(f"expected one CleanPlugin tail, found {text.count(clean)}")
          text = text.replace(clean, '''            mutated.original_range.clear();\n            stagePluginMutationLocked(*loaded, std::move(mutated));\n''', 1)
          itm = '''            if (removed != 0) {\n                fo4::write_plugin_file(mutated, loaded->path);\n                loaded->plugin = std::move(mutated);\n                std::error_code ec;\n                loaded->loadedTime = std::filesystem::last_write_time(loaded->path, ec);\n                rebuildGraphLocked();\n            }\n'''
          if text.count(itm) != 1:
              raise SystemExit(f"expected one ITM tail, found {text.count(itm)}")
          text = text.replace(itm, '''            if (removed != 0) {\n                stagePluginMutationLocked(*loaded, std::move(mutated));\n            }\n''', 1)
          maintenance.write_text(text)
          PY
          git diff --check
      - name: Rebuild incrementally
        run: cmake --build build/fo4ide-174b-core --target fo4ide_test_plugin_backend
      - name: Prove deferred core writers
        run: |
          build/fo4ide-174b-core/bin/fo4ide_test_plugin_backend "Native AddMasters*"
          build/fo4ide-174b-core/bin/fo4ide_test_plugin_backend "Native CompactToEsl*"
          build/fo4ide-174b-core/bin/fo4ide_test_plugin_backend "Native cell transform*"
          build/fo4ide-174b-core/bin/fo4ide_test_plugin_backend "Native CleanPlugin*"
          build/fo4ide-174b-core/bin/fo4ide_test_plugin_backend "Native RemoveIdenticalToMaster*"
          build/fo4ide-174b-core/bin/fo4ide_test_plugin_backend "Native CopyAsNewRecord*"
      - name: Commit core-writer implementation
        run: |
          git add PluginEditTool/native/src/plugin/RadiclePluginMasterMutation.cpp PluginEditTool/native/src/plugin/RadiclePluginCompact.cpp PluginEditTool/native/src/plugin/RadiclePluginCell.cpp PluginEditTool/native/src/plugin/RadiclePluginMaintenance.cpp
          git commit -m "feat: defer remaining core writer persistence"
          git push origin HEAD:work/174b-deferred-mutations
