name: issue-174b-lifecycle-implementation
on:
  push:
    branches:
      - work/174b-deferred-mutations
permissions:
  contents: write
jobs:
  implement-lifecycle-deferred-save:
    runs-on: [self-hosted, Linux, X64, garden]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/174b-deferred-mutations
      - name: Load Ponytail rules
        run: |
          rm -rf /tmp/ponytail-174b-lifecycle
          git clone --depth=1 https://github.com/DietrichGebert/ponytail.git /tmp/ponytail-174b-lifecycle
          test -f /tmp/ponytail-174b-lifecycle/AGENTS.md
      - name: Defer lifecycle mutations
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("PluginEditTool/native/src/plugin/RadiclePluginLifecycle.cpp")
          text = path.read_text()
          old = '''        fo4::write_plugin_file(mutated, loaded->path);\n        loaded->plugin = std::move(mutated);\n        {\n            std::error_code ec;\n            loaded->loadedTime = std::filesystem::last_write_time(loaded->path, ec);\n        }\n        rebuildGraphLocked();\n'''
          count = text.count(old)
          if count != 3:
              raise SystemExit(f"expected 3 lifecycle write-through tails, found {count}")
          text = text.replace(old, '''        stagePluginMutationLocked(*loaded, std::move(mutated));\n''')
          path.write_text(text)
          PY
          git diff --check
      - name: Build focused lifecycle tests
        run: |
          cmake -S PluginEditTool/native -B build/fo4ide-174b-lifecycle -G Ninja -DCMAKE_BUILD_TYPE=Debug -DFO4IDE_BUILD_TESTS=ON -DFO4IDE_BUILD_HTTP=OFF
          cmake --build build/fo4ide-174b-lifecycle --target fo4ide_test_plugin_backend
      - name: Prove deferred lifecycle persistence
        run: |
          build/fo4ide-174b-lifecycle/bin/fo4ide_test_plugin_backend "Native lifecycle creates renumbers and deletes a persisted typed record"
          build/fo4ide-174b-lifecycle/bin/fo4ide_test_plugin_backend "Native lifecycle creates LVSP with validated initial entries"
          build/fo4ide-174b-lifecycle/bin/fo4ide_test_plugin_backend "Native lifecycle creates and renumbers in light plugins"
          build/fo4ide-174b-lifecycle/bin/fo4ide_test_plugin_backend "Native lifecycle refuses delete and renumber across external references"
          build/fo4ide-174b-lifecycle/bin/fo4ide_test_plugin_backend "Native lifecycle refuses protected Data plugins"
      - name: Commit implementation
        run: |
          git rm .github/workflows/174b-lifecycle-implementation.yml
          git config user.name "NomadsReach"
          git config user.email "144523850+NomadsReach@users.noreply.github.com"
          git add PluginEditTool/native/src/plugin/RadiclePluginLifecycle.cpp
          git commit -m "feat: defer lifecycle persistence until SavePlugin"
          git push origin HEAD:work/174b-deferred-mutations
