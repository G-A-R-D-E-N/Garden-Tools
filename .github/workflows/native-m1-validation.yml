name: Native M1 validation

on:
  push:
    branches:
      - native-m1-foundation

permissions:
  contents: read
  statuses: write

concurrency:
  group: native-m1-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  linux-clang:
    name: Native Linux Clang
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure, build, and test
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          post_status() {
            local context="$1" state="$2" description="$3"
            python3 - "$context" "$state" "$description" > /tmp/status.json <<'PY'
          import json, sys
          print(json.dumps({"state": sys.argv[2], "context": sys.argv[1], "description": sys.argv[3][:140]}))
          PY
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              --data-binary @/tmp/status.json >/dev/null
          }
          fail_with_log() {
            local context="$1" log="$2" rc="$3"
            local detail
            detail="$(grep -E '(error:|fatal error:|FAILED:|CMake Error|Error:|FAILED|Timeout|[0-9]+% tests passed)' "$log" | tail -1 | tr '\n' ' ' | cut -c1-130)"
            [[ -n "$detail" ]] || detail="$(tail -1 "$log" | tr '\n' ' ' | cut -c1-130)"
            post_status "$context" failure "$detail"
            cat "$log"
            exit "$rc"
          }
          clang_version="$(clang++ --version | head -1)"
          cmake --version | head -1
          rm -rf native/out/linux-clang-debug
          cmake -S native -B native/out/linux-clang-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++ -DFO4IDE_BUILD_TESTS=ON > /tmp/native-config.log 2>&1
          rc=$?
          [[ $rc -eq 0 ]] || fail_with_log native-linux-config /tmp/native-config.log "$rc"
          post_status native-linux-config success "$clang_version"
          cmake --build native/out/linux-clang-debug --parallel 2 > /tmp/native-build.log 2>&1
          rc=$?
          [[ $rc -eq 0 ]] || fail_with_log native-linux-build /tmp/native-build.log "$rc"
          post_status native-linux-build success "Clang build passed"
          timeout 180s ctest --test-dir native/out/linux-clang-debug --output-on-failure --timeout 10 > /tmp/native-test.log 2>&1
          rc=$?
          [[ $rc -eq 0 ]] || fail_with_log native-linux-test /tmp/native-test.log "$rc"
          summary="$(grep -E '[0-9]+% tests passed' /tmp/native-test.log | tail -1 | tr '\n' ' ' | cut -c1-130)"
          [[ -n "$summary" ]] || summary="CTest passed"
          post_status native-linux-test success "$summary"
          cat /tmp/native-config.log
          cat /tmp/native-build.log
          cat /tmp/native-test.log

  windows-msvc:
    name: Native Windows MSVC
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure, build, and test
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Set-Status([string]$Context, [string]$State, [string]$Description) {
            if ($Description.Length -gt 140) { $Description = $Description.Substring(0, 140) }
            $body = @{ state = $State; context = $Context; description = $Description } | ConvertTo-Json -Compress
            $headers = @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
            }
            Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" -Headers $headers -Body $body -ContentType 'application/json' | Out-Null
          }
          function Fail-WithLog([string]$Context, [string]$LogPath, [int]$Code) {
            $lines = Get-Content $LogPath
            $detail = $lines | Where-Object { $_ -match 'error |error:|fatal error|FAILED:|CMake Error|Error:|FAILED|Timeout|tests passed' } | Select-Object -Last 1
            if (-not $detail) { $detail = $lines | Select-Object -Last 1 }
            Set-Status $Context 'failure' ([string]$detail)
            Get-Content $LogPath
            exit $Code
          }
          Remove-Item -Recurse -Force native/out/windows-msvc-debug -ErrorAction SilentlyContinue
          $configLog = 'native-msvc-config.log'
          & cmake -S native -B native/out/windows-msvc-debug -G 'Visual Studio 17 2022' -A x64 -DFO4IDE_BUILD_TESTS=ON *>&1 | Tee-Object -FilePath $configLog
          $rc = $LASTEXITCODE
          if ($rc -ne 0) { Fail-WithLog 'native-msvc-config' $configLog $rc }
          $compilerLine = Get-Content $configLog | Where-Object { $_ -match 'CXX compiler identification is MSVC' } | Select-Object -First 1
          if (-not $compilerLine) { $compilerLine = 'MSVC configure passed' }
          Set-Status 'native-msvc-config' 'success' ([string]$compilerLine)
          $buildLog = 'native-msvc-build.log'
          & cmake --build native/out/windows-msvc-debug --config Debug --parallel 2 *>&1 | Tee-Object -FilePath $buildLog
          $rc = $LASTEXITCODE
          if ($rc -ne 0) { Fail-WithLog 'native-msvc-build' $buildLog $rc }
          Set-Status 'native-msvc-build' 'success' 'MSVC Debug build passed'
          $testLog = 'native-msvc-test.log'
          & ctest --test-dir native/out/windows-msvc-debug -C Debug --output-on-failure --timeout 10 *>&1 | Tee-Object -FilePath $testLog
          $rc = $LASTEXITCODE
          if ($rc -ne 0) { Fail-WithLog 'native-msvc-test' $testLog $rc }
          $summary = Get-Content $testLog | Where-Object { $_ -match '[0-9]+% tests passed' } | Select-Object -Last 1
          if (-not $summary) { $summary = 'CTest passed' }
          Set-Status 'native-msvc-test' 'success' ([string]$summary)
