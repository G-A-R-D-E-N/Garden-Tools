name: validate-ckini-golden

# Golden-file check for the validate_ckini.py compile-text composition oracle.
# Regenerates the per-language-stem composition from the committed cross-check
# fixture (no game files needed) and fails if it drifts from the committed
# golden file -- any change in routing predictions, category attribution, or
# the fixture itself must be accompanied by a regenerated golden file.
#
# Regenerate locally, FROM THE REPO ROOT (the "roots" field is CWD-relative):
#   python3 Resources/RE-Work/tools/validate_ckini.py \
#     --compile-text Resources/RE-Work/tools/samples/compile-text/cross-check/input \
#     --strings Resources/RE-Work/tools/samples/compile-text/cross-check/STRINGS \
#     --composition-out \
#     Resources/RE-Work/tools/samples/compile-text/cross-check/composition.golden.json

on:
  push:
    branches:
      - main
      - "work/**"
    paths:
      - "Resources/RE-Work/tools/validate_ckini.py"
      - "Resources/RE-Work/tools/samples/compile-text/**"
      - ".github/workflows/validate-ckini-golden.yml"
  pull_request:
    paths:
      - "Resources/RE-Work/tools/validate_ckini.py"
      - "Resources/RE-Work/tools/samples/compile-text/**"
      - ".github/workflows/validate-ckini-golden.yml"
  workflow_dispatch:

concurrency:
  group: validate-ckini-golden-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden:
    name: Composition golden-file drift check
    # Self-hosted per repo convention (GHRUNNER#24: hosted minutes exhausted).
    runs-on: [self-hosted, Linux, X64, garden]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Regenerate composition from the committed fixture
        # Exit 0 (clean) or 1 (the fixture's intentional MISMATCH) are both
        # expected; anything above 1 means the validator crashed and fails.
        run: |
          set +e
          python3 Resources/RE-Work/tools/validate_ckini.py \
            --compile-text Resources/RE-Work/tools/samples/compile-text/cross-check/input \
            --strings Resources/RE-Work/tools/samples/compile-text/cross-check/STRINGS \
            --composition-out "$RUNNER_TEMP/composition.json" >/dev/null 2>&1
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then
            echo "::error::validate_ckini.py crashed (exit $rc) while regenerating the composition"
            exit 1
          fi

      - name: Diff against the committed golden file
        run: |
          if ! diff -u \
            Resources/RE-Work/tools/samples/compile-text/cross-check/composition.golden.json \
            "$RUNNER_TEMP/composition.json"; then
            echo "::error::composition drifted from the committed golden file; regenerate it with --composition-out (from the repo root) and commit the updated golden file"
            exit 1
          fi
          echo "Golden composition matches."
