name: Private-only checks

# Checks that read files the public CI export leaves out.
on:
  pull_request:
  push:
    branches: [main, nomad/dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Private-only checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check the bundled tools against the release workflow
        run: python3 -I -B .github/scripts/test_bundled_tools_manifest.py
