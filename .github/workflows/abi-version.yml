name: abi-version

# Constraint: one RADICLE_ABI_VERSION per surface; see docs/code-notes/GARDEN-TOOLS.md at .github/scripts/check_abi_version_collision.py:claim_conflicts.

on:
  pull_request:
    paths:
      - "Radicle/include/fo4/**"
      - "Radicle/bindings/csharp/**"
      - "Radicle/tests/test_c_api_quest.cpp"
      - ".github/scripts/check_abi_version_collision.py"
      - ".github/workflows/abi-version.yml"

permissions:
  contents: read
  pull-requests: read

jobs:
  unique:
    name: ABI number is unique
    runs-on: [self-hosted, Linux, X64, garden]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Constraint: the script needs the pushed head, not the merge commit.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check the ABI number
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 -I .github/scripts/check_abi_version_collision.py
