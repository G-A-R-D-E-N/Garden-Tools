name: Radicle C ABI and native backend

on:
  push:
    branches:
      - work/radicle-c-abi
    paths:
      - Radicle/**
      - PluginEditTool/native/**
      - .github/workflows/radicle-c-abi.yml

jobs:
  radicle-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev
      - name: Configure Radicle
        run: cmake -S Radicle -B build/radicle -G Ninja -DRADICLE_BUILD_TESTS=ON -DRADICLE_BUILD_TOOLS=ON
      - name: Build Radicle
        run: cmake --build build/radicle --parallel 2
      - name: Test Radicle
        run: ctest --test-dir build/radicle --output-on-failure

  pluginedit-native-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev
      - name: Configure PluginEditTool native
        run: cmake -S PluginEditTool/native -B build/plugin-edit -G Ninja -DFO4IDE_BUILD_HTTP=OFF -DFO4IDE_BUILD_TESTS=ON
      - name: Build PluginEditTool native
        run: cmake --build build/plugin-edit --parallel 2
      - name: Test PluginEditTool native
        run: ctest --test-dir build/plugin-edit --output-on-failure
