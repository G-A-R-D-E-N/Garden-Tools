name: issue-174b-condition-red
on:
  push:
    branches:
      - work/174b-deferred-mutations
permissions:
  contents: write
jobs:
  prove-condition-write-through:
    runs-on: [self-hosted, Linux, X64, garden]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/174b-deferred-mutations
      - name: Load Ponytail rules
        run: |
          rm -rf /tmp/ponytail-174b-condition-red
          git clone --depth=1 https://github.com/DietrichGebert/ponytail.git /tmp/ponytail-174b-condition-red
          test -f /tmp/ponytail-174b-condition-red/AGENTS.md
      - name: Apply deferred condition RED contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("PluginEditTool/native/tests/unit/ConditionBackendTests.cpp")
          text = path.read_text()

          old = '''    // The record persists on disk with the new list.\n    auto onDisk = fo4ide::plugin::RadiclePluginBackend{};\n    REQUIRE(onDisk.invoke("environment.LoadMo2",\n                          nlohmann::json{{"plugins", nlohmann::json::array(\n                                                         {pluginEntry("CondEdit.esp", pluginPath, "Override")})}})\n                .has_value());\n    const auto reread = parseStringResult(\n        onDisk.invoke("backend.GetConditions",\n                      nlohmann::json::array({"CondEdit.esp", "000800:CondEdit.esp"})));\n    REQUIRE(reread.size() == 2);\n    CHECK(reread[0].at("function") == "GetStage");\n'''
          new = '''    auto beforeSave = fo4ide::plugin::RadiclePluginBackend{};\n    REQUIRE(beforeSave.invoke("environment.LoadMo2",\n                              nlohmann::json{{"plugins", nlohmann::json::array(\n                                                             {pluginEntry("CondEdit.esp", pluginPath, "Override")})}})\n                .has_value());\n    const auto beforeSaveConditions = parseStringResult(\n        beforeSave.invoke("backend.GetConditions",\n                          nlohmann::json::array({"CondEdit.esp", "000800:CondEdit.esp"})));\n    REQUIRE(beforeSaveConditions.size() == 2);\n    CHECK(beforeSaveConditions[0].at("function") == "GetDistance");\n\n    REQUIRE(backend.invoke(\n        "backend.SavePlugin", nlohmann::json::array({"CondEdit.esp"})).has_value());\n\n    auto onDisk = fo4ide::plugin::RadiclePluginBackend{};\n    REQUIRE(onDisk.invoke("environment.LoadMo2",\n                          nlohmann::json{{"plugins", nlohmann::json::array(\n                                                         {pluginEntry("CondEdit.esp", pluginPath, "Override")})}})\n                .has_value());\n    const auto reread = parseStringResult(\n        onDisk.invoke("backend.GetConditions",\n                      nlohmann::json::array({"CondEdit.esp", "000800:CondEdit.esp"})));\n    REQUIRE(reread.size() == 2);\n    CHECK(reread[0].at("function") == "GetStage");\n'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one root condition disk assertion, found {text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''    const auto second = parseStringResult(\n        backend.invoke("backend.GetConditionsAtPath",\n                       nlohmann::json::array({"SpellEdit.esp", "000800:SpellEdit.esp",\n                                              "Effects[1].Conditions"})));\n    REQUIRE(second.size() == 2);\n}\n\nTEST_CASE("condition backend: SetConditionsAt clears one effect scope without touching siblings")'''
          new = '''    const auto second = parseStringResult(\n        backend.invoke("backend.GetConditionsAtPath",\n                       nlohmann::json::array({"SpellEdit.esp", "000800:SpellEdit.esp",\n                                              "Effects[1].Conditions"})));\n    REQUIRE(second.size() == 2);\n\n    auto beforeSave = fo4ide::plugin::RadiclePluginBackend{};\n    REQUIRE(beforeSave.invoke("environment.LoadMo2",\n                              nlohmann::json{{"plugins", nlohmann::json::array(\n                                                             {pluginEntry("SpellEdit.esp", pluginPath, "Override")})}})\n                .has_value());\n    const auto beforeSaveFirst = parseStringResult(\n        beforeSave.invoke("backend.GetConditionsAtPath",\n                          nlohmann::json::array({"SpellEdit.esp", "000800:SpellEdit.esp",\n                                                 "Effects[0].Conditions"})));\n    REQUIRE(beforeSaveFirst.size() == 1);\n    CHECK(beforeSaveFirst[0].at("function") == "GetAngle");\n\n    REQUIRE(backend.invoke(\n        "backend.SavePlugin", nlohmann::json::array({"SpellEdit.esp"})).has_value());\n    auto onDisk = fo4ide::plugin::RadiclePluginBackend{};\n    REQUIRE(onDisk.invoke("environment.LoadMo2",\n                          nlohmann::json{{"plugins", nlohmann::json::array(\n                                                         {pluginEntry("SpellEdit.esp", pluginPath, "Override")})}})\n                .has_value());\n    const auto persisted = parseStringResult(\n        onDisk.invoke("backend.GetConditionsAtPath",\n                      nlohmann::json::array({"SpellEdit.esp", "000800:SpellEdit.esp",\n                                             "Effects[0].Conditions"})));\n    REQUIRE(persisted.size() == 2);\n    CHECK(persisted[0].at("function") == "GetStage");\n}\n\nTEST_CASE("condition backend: SetConditionsAt clears one effect scope without touching siblings")'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one scoped condition assertion block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Build focused condition tests
        run: |
          cmake -S PluginEditTool/native -B build/fo4ide-174b-condition-red -G Ninja -DCMAKE_BUILD_TYPE=Debug -DFO4IDE_BUILD_TESTS=ON -DFO4IDE_BUILD_HTTP=OFF
          cmake --build build/fo4ide-174b-condition-red --target fo4ide_test_plugin_backend
      - name: Prove condition paths write through
        run: |
          set +e
          for test in \
            "condition backend: SetConditions replaces the list and round-trips" \
            "condition backend: SetConditionsAt replaces one effect scope and round-trips"; do
            build/fo4ide-174b-condition-red/bin/fo4ide_test_plugin_backend "$test" > /tmp/current-red.txt 2>&1
            status=$?
            cat /tmp/current-red.txt
            test "$status" -ne 0 || exit 1
            grep -F 'FAILED:' /tmp/current-red.txt || exit 1
          done
          set -e
      - name: Commit RED proof
        run: |
          git rm .github/workflows/174b-condition-red.yml
          git config user.name "NomadsReach"
          git config user.email "144523850+NomadsReach@users.noreply.github.com"
          git add PluginEditTool/native/tests/unit/ConditionBackendTests.cpp
          git commit -m "test: prove deferred condition persistence contract"
          git push origin HEAD:work/174b-deferred-mutations
