name: pet-web-ci

# Lint, type-check, build and unit-test the PluginEditTool web UI. native-ci ignores PluginEditTool/web on main pushes.

on:
  push:
    branches:
      - main
    paths:
      - "PluginEditTool/web/**"
      - ".github/workflows/pet-web-ci.yml"
  pull_request:
    paths:
      - "PluginEditTool/web/**"
      - ".github/workflows/pet-web-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes a pull request run, but main runs always finish.
concurrency:
  group: pet-web-ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web lint, build and tests
    runs-on: [self-hosted, Linux, X64, garden]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: PluginEditTool/web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # No other workflow installs Node; vite 8, vitest 4 and eslint 10 all need 20.19 or newer.
      - name: Set up Node 22
        uses: https://github.com/actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: PluginEditTool/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The steps below run even after an earlier failure so one run reports lint, type and test results together.
      - name: Lint
        if: success() || failure()
        run: npm run lint

      # The build script is `tsc -b && vite build`.
      - name: Type-check and build
        if: success() || failure()
        run: npm run build

      - name: Unit tests
        if: success() || failure()
        run: npm test
