name: issue-174b-override-red
on:
  push:
    branches:
      - work/174b-deferred-mutations
permissions:
  contents: write
jobs:
  prove-override-write-through:
    runs-on: [self-hosted, Linux, X64, garden]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: work/174b-deferred-mutations
      - name: Load Ponytail rules
        run: |
          rm -rf /tmp/ponytail-174b-override-red
          git clone --depth=1 https://github.com/DietrichGebert/ponytail.git /tmp/ponytail-174b-override-red
          test -f /tmp/ponytail-174b-override-red/AGENTS.md
      - name: Apply deferred override RED contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"expected one match in {path}, found {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          single = "PluginEditTool/native/tests/unit/RadiclePluginMutationTests.cpp"
          replace_once(
              single,
              '''    const auto reloaded = fo4::read_plugin_file(targetPath);\n    REQUIRE(reloaded.header.masters.size() == 1);\n    CHECK(reloaded.header.masters[0].key.filename() == "Master.esm");\n\n    const auto* local = fo4::find_record(\n        reloaded, fo4::FormKey::parse("000810:Target.esp"));\n    REQUIRE(local != nullptr);\n    CHECK(local->header.form_id == fo4::RawFormId{0x01000810});\n\n    const auto* overrideRecord = fo4::find_record(\n        reloaded, fo4::FormKey::parse("000800:Master.esm"));\n    REQUIRE(overrideRecord != nullptr);\n    CHECK(editorId(*overrideRecord) == "SourceWeapon");\n\n    const auto links = fo4::collect_form_links(reloaded);\n    const auto link = std::find_if(links.begin(), links.end(), [](const auto& hit) {\n        return hit.record == fo4::FormKey::parse("000800:Master.esm") &&\n               hit.subrecord.to_string() == "NAME";\n    });\n    REQUIRE(link != links.end());\n    CHECK(link->key == fo4::FormKey::parse("000801:Master.esm"));\n\n    const auto exists = backend.invokeBackend(\n''',
              '''    const auto beforeSave = fo4::read_plugin_file(targetPath);\n    CHECK(beforeSave.header.masters.empty());\n    CHECK(fo4::find_record(\n        beforeSave, fo4::FormKey::parse("000800:Master.esm")) == nullptr);\n\n    const auto pendingMatrix = parseStringResult(\n        backend.invoke("backend.GetConflictMatrix",\n                       nlohmann::json::array({"000800:Master.esm"})));\n    CHECK(pendingMatrix.at("Winner") == "Target.esp");\n\n    const auto exists = backend.invokeBackend(\n'''
          )
          replace_once(
              single,
              '''    REQUIRE(replaced.has_value());\n    CHECK(replaced->get<std::string>().find("Replaced") == 0);\n\n    const auto matrix = parseStringResult(\n        backend.invoke("backend.GetConflictMatrix",\n                       nlohmann::json::array({"000800:Master.esm"})));\n    CHECK(matrix.at("Winner") == "Target.esp");\n    REQUIRE(matrix.at("Plugins").size() == 2);\n}\n\nTEST_CASE("Native CopyAsOverride refuses protected destination plugins")''',
              '''    REQUIRE(replaced.has_value());\n    CHECK(replaced->get<std::string>().find("Replaced") == 0);\n\n    REQUIRE(backend.invoke(\n        "backend.SavePlugin", nlohmann::json::array({"Target.esp"})).has_value());\n    const auto reloaded = fo4::read_plugin_file(targetPath);\n    REQUIRE(reloaded.header.masters.size() == 1);\n    CHECK(reloaded.header.masters[0].key.filename() == "Master.esm");\n\n    const auto* local = fo4::find_record(\n        reloaded, fo4::FormKey::parse("000810:Target.esp"));\n    REQUIRE(local != nullptr);\n    CHECK(local->header.form_id == fo4::RawFormId{0x01000810});\n\n    const auto* overrideRecord = fo4::find_record(\n        reloaded, fo4::FormKey::parse("000800:Master.esm"));\n    REQUIRE(overrideRecord != nullptr);\n    CHECK(editorId(*overrideRecord) == "SourceWeapon");\n\n    const auto links = fo4::collect_form_links(reloaded);\n    const auto link = std::find_if(links.begin(), links.end(), [](const auto& hit) {\n        return hit.record == fo4::FormKey::parse("000800:Master.esm") &&\n               hit.subrecord.to_string() == "NAME";\n    });\n    REQUIRE(link != links.end());\n    CHECK(link->key == fo4::FormKey::parse("000801:Master.esm"));\n}\n\nTEST_CASE("Native CopyAsOverride refuses protected destination plugins")'''
          )

          batch = "PluginEditTool/native/tests/unit/RadiclePluginBatchMutationTests.cpp"
          replace_once(
              batch,
              '''    CHECK(result.at("requiresOverwrite") == false);\n\n    const auto reloaded = fo4::read_plugin_file(target);\n''',
              '''    CHECK(result.at("requiresOverwrite") == false);\n\n    const auto beforeSave = fo4::read_plugin_file(target);\n    CHECK(beforeSave.header.masters.empty());\n    CHECK(fo4::find_record(\n        beforeSave, fo4::FormKey::parse("000800:Master.esm")) == nullptr);\n    CHECK(fo4::find_record(\n        beforeSave, fo4::FormKey::parse("000802:Master.esm")) == nullptr);\n\n    REQUIRE(backend.invoke(\n        "backend.SavePlugin", nlohmann::json::array({"Patch.esp"})).has_value());\n    const auto reloaded = fo4::read_plugin_file(target);\n'''
          )
          replace_once(
              batch,
              '''    REQUIRE(parseResult(backend.invokeBackend(\n        "CopyAsOverrideMany",\n        nlohmann::json::array({items.dump(), "Patch.esp", false}))).at("ok") == 2);\n\n    const auto before = fo4::test::original_bytes(fo4::read_plugin_file(target));\n''',
              '''    REQUIRE(parseResult(backend.invokeBackend(\n        "CopyAsOverrideMany",\n        nlohmann::json::array({items.dump(), "Patch.esp", false}))).at("ok") == 2);\n\n    const auto beforePlugin = fo4::read_plugin_file(target);\n    CHECK(beforePlugin.header.masters.empty());\n    CHECK(fo4::find_record(\n        beforePlugin, fo4::FormKey::parse("000800:Master.esm")) == nullptr);\n    const auto before = fo4::test::original_bytes(beforePlugin);\n'''
          )
          replace_once(
              batch,
              '''    CHECK(overwrite.at("requiresOverwrite") == false);\n    CHECK(overwrite.at("ok") == 2);\n    CHECK(overwrite.at("failed") == 0);\n}\n\nTEST_CASE("Native CopyAsOverrideMany reports per-item failures and commits successes")''',
              '''    CHECK(overwrite.at("requiresOverwrite") == false);\n    CHECK(overwrite.at("ok") == 2);\n    CHECK(overwrite.at("failed") == 0);\n    CHECK(fo4::test::original_bytes(fo4::read_plugin_file(target)) == before);\n\n    REQUIRE(backend.invoke(\n        "backend.SavePlugin", nlohmann::json::array({"Patch.esp"})).has_value());\n    const auto saved = fo4::read_plugin_file(target);\n    CHECK(fo4::find_record(\n        saved, fo4::FormKey::parse("000800:Master.esm")) != nullptr);\n    CHECK(fo4::find_record(\n        saved, fo4::FormKey::parse("000802:Master.esm")) != nullptr);\n}\n\nTEST_CASE("Native CopyAsOverrideMany reports per-item failures and commits successes")'''
          )
          PY
          git diff --check
      - name: Build focused override tests
        run: |
          cmake -S PluginEditTool/native -B build/fo4ide-174b-override-red -G Ninja -DCMAKE_BUILD_TYPE=Debug -DFO4IDE_BUILD_TESTS=ON -DFO4IDE_BUILD_HTTP=OFF
          cmake --build build/fo4ide-174b-override-red --target fo4ide_test_plugin_backend
      - name: Prove override paths write through
        run: |
          set +e
          for test in \
            "Native CopyAsOverride persists a destination-safe override" \
            "Native CopyAsOverrideMany copies selected conflicts in one transaction" \
            "Native CopyAsOverrideMany preflights overwrite conflicts without writing"; do
            build/fo4ide-174b-override-red/bin/fo4ide_test_plugin_backend "$test" > /tmp/override-red.txt 2>&1
            status=$?
            cat /tmp/override-red.txt
            test "$status" -ne 0 || exit 1
            grep -F 'FAILED:' /tmp/override-red.txt || exit 1
          done
          set -e
      - name: Commit RED proof
        run: |
          git rm .github/workflows/174b-override-red.yml
          git config user.name "NomadsReach"
          git config user.email "144523850+NomadsReach@users.noreply.github.com"
          git add PluginEditTool/native/tests/unit/RadiclePluginMutationTests.cpp PluginEditTool/native/tests/unit/RadiclePluginBatchMutationTests.cpp
          git commit -m "test: prove deferred override persistence contract"
          git push origin HEAD:work/174b-deferred-mutations
