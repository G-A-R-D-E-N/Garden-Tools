name: plugin-editor-ci

# Managed (C#) tests for PluginEditTool. native-ci.yml covers the native/CTest build and ignores these paths.

on:
  push:
    branches:
      - main
    paths:
      - "PluginEditTool/FO4RecordEditor*/**"
      - "PluginEditTool/Mutagen/**"
      - "PluginEditTool/README.md"
      - "PluginEditTool/docs/MCP_SETUP.md"
      - "PluginEditTool/native/apps/fo4ide/McpTools.cpp"
      - ".github/workflows/plugin-editor-ci.yml"
  pull_request:
    paths:
      - "PluginEditTool/FO4RecordEditor*/**"
      - "PluginEditTool/Mutagen/**"
      - "PluginEditTool/README.md"
      - "PluginEditTool/docs/MCP_SETUP.md"
      - "PluginEditTool/native/apps/fo4ide/McpTools.cpp"
      - ".github/workflows/plugin-editor-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels pull request and branch runs; main runs always finish.
concurrency:
  group: plugin-editor-ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Managed tests (Windows)
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    # GitVersion.MsBuild needs full git history, which the shallow checkout lacks; the tests do not use the version.
    env:
      DisableGitVersionTask: "true"
    defaults:
      run:
        shell: cmd
        working-directory: PluginEditTool
    steps:
      # Full URL gives this workflow its own action cache; the shared actions/checkout cache races with native-ci's Windows job (shallow.lock).
      - name: Check out repository
        uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The 10.0 SDK builds both targets; the 9.0 SDK supplies the exact 9.0.19 runtime the net9.0-windows test host needs.
      - name: Set up pinned .NET SDKs
        uses: https://github.com/actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet-10.0.401-9.0.317
        with:
          dotnet-version: |
            10.0.401
            9.0.317

      - name: Restore FO4RecordEditor.Tests
        run: dotnet restore FO4RecordEditor.Tests/FO4RecordEditor.Tests.csproj --locked-mode

      - name: Restore FO4RecordEditor.Core.Tests
        run: dotnet restore FO4RecordEditor.Core.Tests/FO4RecordEditor.Core.Tests.csproj --locked-mode

      - name: Build FO4RecordEditor.Tests
        run: dotnet build FO4RecordEditor.Tests/FO4RecordEditor.Tests.csproj --configuration Release --no-restore

      - name: Build FO4RecordEditor.Core.Tests
        run: dotnet build FO4RecordEditor.Core.Tests/FO4RecordEditor.Core.Tests.csproj --configuration Release --no-restore

      # The runner's home folder is a reparse point, which the archive path-safety checks refuse; keep temp files under the job's temp folder.
      - name: Test FO4RecordEditor.Tests
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: dotnet test FO4RecordEditor.Tests/FO4RecordEditor.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=windows-tests.trx" --results-directory ../TestResults

      - name: Test FO4RecordEditor.Core.Tests
        if: ${{ !cancelled() }}
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: dotnet test FO4RecordEditor.Core.Tests/FO4RecordEditor.Core.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=windows-core-tests.trx" --results-directory ../TestResults

      - name: Stop .NET build servers
        if: always()
        run: dotnet build-server shutdown

      - name: Upload test results on failure
        if: failure()
        continue-on-error: true
        uses: https://code.forgejo.org/forgejo/upload-artifact@cb8afe72b42edc798abfb8fcb556cf660d894245 # v5
        with:
          name: plugin-editor-windows-failure
          path: TestResults/**
          if-no-files-found: ignore
          retention-days: 3

  linux:
    name: Core managed tests (Linux)
    runs-on: [self-hosted, Linux, X64, garden]
    timeout-minutes: 45
    # GitVersion.MsBuild needs full git history, which the shallow checkout lacks; the tests do not use the version.
    env:
      DisableGitVersionTask: "true"
    defaults:
      run:
        shell: bash
        working-directory: PluginEditTool
    steps:
      - name: Check out repository
        uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pinned .NET SDK
        uses: https://github.com/actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet-10.0.401
        with:
          dotnet-version: 10.0.401

      - name: Restore FO4RecordEditor.Core.Tests
        run: dotnet restore FO4RecordEditor.Core.Tests/FO4RecordEditor.Core.Tests.csproj --locked-mode

      - name: Build FO4RecordEditor.Core.Tests
        run: dotnet build FO4RecordEditor.Core.Tests/FO4RecordEditor.Core.Tests.csproj --configuration Release --no-restore

      - name: Test FO4RecordEditor.Core.Tests
        run: dotnet test FO4RecordEditor.Core.Tests/FO4RecordEditor.Core.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=linux-core-tests.trx" --results-directory ../TestResults

      - name: Stop .NET build servers
        if: always()
        run: dotnet build-server shutdown

      - name: Upload test results on failure
        if: failure()
        continue-on-error: true
        uses: https://code.forgejo.org/forgejo/upload-artifact@cb8afe72b42edc798abfb8fcb556cf660d894245 # v5
        with:
          name: plugin-editor-linux-failure
          path: TestResults/**
          if-no-files-found: ignore
          retention-days: 3
