name: bgs-tests-ci

# Must not be named bgs-ci: the export refuses that retired name.
on:
  push:
    branches: ["ci/**"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: BGS xUnit tests (ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: garden-tools-ci
    defaults:
      run:
        working-directory: BGS
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Requires the private checked-in clips, restored as native-ci does; no FO4_DATA_DIR is set.
      - name: Restore the private test fixtures
        working-directory: ${{ github.workspace }}
        env:
          TOKEN: ${{ secrets.GT_PUBLIC_CI_TOKEN }}
        run: bash .github/scripts/fetch-private-fixtures.sh

      - name: Install build tools
        working-directory: ${{ github.workspace }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build ccache
          printf 'CC=gcc-14\nCXX=g++-14\n' >> "$GITHUB_ENV"

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.424
          cache: true
          cache-dependency-path: BGS/**/packages.lock.json

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ccache
          key: ccache-bgs-tests-${{ github.sha }}
          restore-keys: ccache-bgs-tests-

      # Requires libradicle.so in build/radicle-bgs/native for BA2 reads; Directory.Build.targets copies it from there.
      - name: Build native Radicle library
        run: |
          cmake -S ../Radicle -B ../build/radicle-bgs -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DRADICLE_BUILD_TESTS=OFF -DRADICLE_BUILD_TOOLS=OFF -DRADICLE_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_CXX_FLAGS=-Wno-error=free-nonheap-object \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build ../build/radicle-bgs --target radicle_c
          mkdir -p ../build/radicle-bgs/native
          cp ../build/radicle-bgs/libradicle.so ../build/radicle-bgs/native/
          cp ../build/radicle-bgs/radicle-regex-worker ../build/radicle-bgs/libradicle-regex-runtime.so ../build/radicle-bgs/native/

      - name: Restore tests
        run: dotnet restore tools/tests/BehaviourGraph.Tests.csproj --locked-mode

      - name: Run xUnit suite
        env:
          FO4_DATA_DIR: ""
          BGS_SKIN_DATA: ""
          FO4_NIF_DIR: ""
        run: dotnet test tools/tests/BehaviourGraph.Tests.csproj --configuration Release --no-restore --logger "console;verbosity=normal"

  report:
    name: Report to the private PR
    needs: [tests]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    environment: garden-tools-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Post the result as a commit status on the private commit
        env:
          GH_TOKEN: ${{ secrets.GT_PUBLIC_CI_TOKEN }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          source=$(git log -1 --format=%B | sed -n 's/^Source-Commit: \([0-9a-f]\{40\}\)$/\1/p')
          [ -n "$source" ] || { echo "::error::no Source-Commit trailer"; exit 1; }
          failed=$(jq -r 'to_entries | map(select(.value.result != "success" and .value.result != "skipped") | .key) | join(", ")' <<<"$NEEDS")
          if [ -n "$failed" ]; then state=failure; description="failed: $failed"; else state=success; description="passed"; fi
          gh api "repos/G-A-R-D-E-N/GardenTools/statuses/$source" -f state="$state" \
            -f context="public-ci/bgs-tests-ci" -f target_url="$RUN_URL" -f description="${description:0:140}" >/dev/null
          echo "$state posted for bgs-tests-ci ($description)"
