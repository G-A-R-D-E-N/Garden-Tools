name: native-ci

# Runs the native C++23 build/test on the self-hosted GARDEN-TOOLS runners:
# Linux (label `garden`), Windows (`self-hosted, Windows, X64`) and the Fallout 4
# data host (`fo4-data`). Hosted runners are intentionally avoided: both orgs
# are over the Free Actions minutes allowance (GHRUNNER#24), and hosted jobs
# fail silently once exhausted.
# Self-hosted minutes are free. Pull requests run through the
# pull_request trigger only; work-branch push runs are intentionally omitted so
# one PR commit does not consume two self-hosted CI slots.

on:
  push:
    branches:
      - main
    paths-ignore:
      - "BGS/**"
      - "PluginEditTool/web/**"
      - "PluginEditTool/FO4RecordEditor*/**"
      - "PluginEditTool/Mutagen/**"
      - "PluginEditTool/docs/**"
      - "PluginEditTool/images/**"
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "BGS/**"
      - "PluginEditTool/web/**"
      - "PluginEditTool/FO4RecordEditor*/**"
      - "PluginEditTool/Mutagen/**"
      - "PluginEditTool/docs/**"
      - "PluginEditTool/images/**"
      - "docs/**"
  workflow_dispatch:
    inputs:
      lane:
        description: Validation to run
        type: choice
        default: full
        options:
          - full
          - radicle-cross

permissions:
  contents: read

# A newer push supersedes a pull request or branch run, but main runs always
# finish: cancelling them on every merge left main itself untested.
concurrency:
  group: native-ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

# Every job builds in its own fresh workspace, so compiles go through ccache
# (installed on the runner hosts) to avoid rebuilding unchanged sources.
# base_dir and nohashdir let hits carry across the per-job workspace paths.
# CCACHE_BASEDIR is written by each job's ccache step from its real working
# directory: `${{ github.workspace }}` is empty at workflow level on the
# host-mode runners, which left the base dir blank and the cache cold.
# A runner without ccache still builds, just without the cache.
env:
  CCACHE_NOHASHDIR: "1"
  # All runners share one 12-thread host; cap each build so concurrent jobs
  # don't oversubscribe it. cmake --build reads this when --parallel is absent.
  CMAKE_BUILD_PARALLEL_LEVEL: "4"
  # Fallout 4 data tests: native-windows-real-data runs them, native-windows-tests excludes them.
  REAL_DATA_TEST_REGEX: '[A-Za-z0-9_]*RealData\.|[A-Za-z0-9_]*Real\.|NavmeshCorpus\.Fallout4FixturesBoundaryCountsAndNvppSize|PexCorpus\.EveryDataDirArchivePexRoundTripsByteIdentically|QuestRuntimeReal\.|QuestConditionCorpus\.|RealPluginPreservation\.|CheckErrors\.VanillaMasterHasNoErrorFindings|HedrCount\.OfficialMastersAndLightPluginsRebuildTheRecursiveCountWhenPresent|WeatherConcept\.CorpusDecodeSweepWhenPresent|BehaviorReal\.|DialogueReal\.|DialogueWriterReal\.|BehaviorWriterReal\.|ClimateWeatherReal\.|ConditionScopesReal\.|NavmeshReal\.|NavmeshWriterReal\.|NifCorpus\.|QuestStructureReal\.|SoundWriterReal\.|VegetationReal\.|VmadWriterOfficial\.|Official normal and AutoWeapon sounds'

jobs:
  # PluginEditTool/native builds Radicle as a subproject, so one build covers
  # both: Radicle's own tests, tools and warnings-as-errors are switched on here
  # instead of compiling Radicle a second time in a separate job.
  native-linux:
    name: Native (Linux, Debug)
    if: github.event.inputs.lane != 'radicle-cross'
    runs-on: [self-hosted, Linux, X64, garden]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: Radicle/bindings/csharp/global.json

      - name: Restore RID consumer (linux-x64)
        run: |
          python3 -c 'import os, pathlib, shutil; root = pathlib.Path.cwd(); temp = pathlib.Path(os.environ["RUNNER_TEMP"]) / "radicle-consumer"; temp.mkdir(exist_ok=True); shutil.copy2(root / "Radicle/bindings/csharp/global.json", temp / "global.json"); (temp / "Consumer.csproj").write_text("<Project Sdk=\"Microsoft.NET.Sdk\"><PropertyGroup><TargetFramework>net8.0</TargetFramework><EnableDefaultCompileItems>false</EnableDefaultCompileItems></PropertyGroup><ItemGroup><ProjectReference Include=\"" + str(root / "Radicle/bindings/csharp/Radicle.Interop/Radicle.Interop.csproj") + "\" /></ItemGroup></Project>")'
          cd "$RUNNER_TEMP/radicle-consumer"
          dotnet restore Consumer.csproj -r linux-x64

      - name: Find ccache
        run: |
          for c in "$(command -v ccache || true)" "$HOME/.local/bin/ccache"; do
            if [ -n "$c" ] && [ -x "$c" ]; then
              echo "CCACHE=$c" >> "$GITHUB_ENV"
              echo "CCACHE_BASEDIR=$PWD" >> "$GITHUB_ENV"
              "$c" --zero-stats > /dev/null
              echo "Using $c"
              exit 0
            fi
          done
          echo "ccache not found; building without a compiler cache"

      - name: Configure
        timeout-minutes: 15
        run: |
          for attempt in 1 2 3; do
            if cmake -S PluginEditTool/native -B build/native -G Ninja \
              -DCMAKE_BUILD_TYPE=Debug \
              -DFO4IDE_BUILD_TESTS=ON \
              -DRADICLE_BUILD_TESTS=ON \
              -DRADICLE_BUILD_TOOLS=ON \
              -DRADICLE_CSHARP_TESTS=ON \
              -DRADICLE_WARNINGS_AS_ERRORS=ON \
              ${CCACHE:+-DCMAKE_C_COMPILER_LAUNCHER=$CCACHE -DCMAKE_CXX_COMPILER_LAUNCHER=$CCACHE}; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::configure failed after 3 attempts"
              exit 1
            fi
            echo "::warning::configure attempt $attempt failed, retrying"
            sleep $((attempt * 30))
          done

      - name: Build
        run: cmake --build build/native

      - name: ccache statistics
        if: always()
        run: if [ -n "$CCACHE" ]; then "$CCACHE" --show-stats; fi

      - name: Check FO4 data folder
        env:
          FO4_DATA_DIR: ${{ vars.FO4_DATA_DIR_LINUX }}
        run: |
          if [ -z "$FO4_DATA_DIR" ]; then
            echo "FO4_DATA_DIR_LINUX is unset; real-data tests will skip."
          else
            missing=""
            for m in Fallout4.esm DLCRobot.esm DLCworkshop01.esm DLCworkshop02.esm DLCworkshop03.esm DLCCoast.esm DLCNukaWorld.esm; do
              [ -f "$FO4_DATA_DIR/$m" ] || missing="$missing $m"
            done
            [ -n "$(find "$FO4_DATA_DIR" -maxdepth 1 -type f -iname 'Fallout4 - *.ba2' -print -quit 2>/dev/null)" ] || missing="$missing Fallout4 - *.ba2"
            if [ -n "$missing" ]; then
              echo "FO4_DATA_DIR_LINUX ($FO4_DATA_DIR) is missing:$missing; point it at a Fallout 4 Data folder or unset it."
              exit 1
            fi
            echo "FO4_DATA_DIR: $FO4_DATA_DIR"
            echo "root *.esm: $(find "$FO4_DATA_DIR" -maxdepth 1 -iname '*.esm' | wc -l), *.ba2: $(find "$FO4_DATA_DIR" -maxdepth 1 -iname '*.ba2' | wc -l)"
          fi

      - name: Check real-data regex covers game-data tests
        run: |
          python3 -I -B -m unittest discover -s .github/scripts -p 'test_*.py'
          python3 -I .github/scripts/check_real_data_regex.py

      - name: Check static xEdit scalar deny pass
        run: python3 -I -B -m unittest discover -s Radicle/tools/corpus -p 'test_*.py'

      - name: Test
        env:
          FO4_DATA_DIR: ${{ vars.FO4_DATA_DIR_LINUX }}
        run: |
          if [ -z "$FO4_DATA_DIR" ]; then unset FO4_DATA_DIR; fi
          ctest --test-dir build/native --output-on-failure --parallel 4 -E '^radicle_csharp_bindings$'

      - name: Prove clean managed tests without external networking
        run: unshare --user --map-root-user --net python3 Radicle/bindings/csharp/tools/run_managed_tests.py --build-dir build/native --network-isolated

      - name: Upload logs on failure
        if: failure()
        continue-on-error: true
        uses: https://code.forgejo.org/forgejo/upload-artifact@cb8afe72b42edc798abfb8fcb556cf660d894245 # v5
        with:
          name: native-linux-failure
          path: |
            build/native/Testing/**
            build/native/**/*.log
            build/native/CMakeCache.txt
            build/native/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 3

  # The two Windows cross-compile lanes only prove the code compiles and links
  # with clang-cl/xwin. native-windows-tests already builds and tests the same
  # code with MSVC on every pull request, so these run on main only.
  radicle-windows-cross:
    name: Radicle (Windows cross, clang-cl/xwin, build-only)
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Linux, X64, garden]
    timeout-minutes: 45
    # Cross-compiles the Windows x64 build from Linux with clang-cl + the xwin
    # CRT/SDK (GHRUNNER#17) -- the same method used elsewhere on this host. Wine
    # is retired, so Windows binaries cannot be executed here: this job proves
    # the code COMPILES and LINKS for Windows (tests OFF). native-windows-tests
    # runs the tests with MSVC on the Windows runner.
    #
    # The xwin sysroot does not provide zlib, so this lane builds the pinned
    # static zlib dependency from the cached source and points find_package(ZLIB) at it.
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Find ccache
        run: |
          for c in "$(command -v ccache || true)" "$HOME/.local/bin/ccache"; do
            if [ -n "$c" ] && [ -x "$c" ]; then
              echo "CCACHE=$c" >> "$GITHUB_ENV"
              echo "CCACHE_BASEDIR=$PWD" >> "$GITHUB_ENV"
              "$c" --zero-stats > /dev/null
              echo "Using $c"
              exit 0
            fi
          done
          echo "ccache not found; building without a compiler cache"

      - name: Pinned zlib source (cached)
        run: bash .github/scripts/pinned-zlib.sh

      - name: Build Windows static zlib dependency
        run: |
          cmake -S "$ZLIB_SRC" -B build/zlib-win -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${GITHUB_WORKSPACE}/cmake/xwin-clang-cl.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DZLIB_BUILD_EXAMPLES=OFF \
            ${CCACHE:+-DCMAKE_C_COMPILER_LAUNCHER=$CCACHE -DCMAKE_CXX_COMPILER_LAUNCHER=$CCACHE}
          cmake --build build/zlib-win --target zlibstatic
          cp "$ZLIB_SRC/zlib.h" build/zlib-win/zlib.h
          test -f build/zlib-win/zconf.h
          test -f build/zlib-win/zlibstatic.lib

      - name: Configure (clang-cl / xwin, Release)
        run: |
          for attempt in 1 2 3; do
            if cmake -S Radicle -B build/radicle-win -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/cmake/xwin-clang-cl.cmake \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_TESTING=OFF \
              -DRADICLE_BUILD_TESTS=OFF \
              -DZLIB_INCLUDE_DIR=${{ github.workspace }}/build/zlib-win \
              -DZLIB_LIBRARY=${{ github.workspace }}/build/zlib-win/zlibstatic.lib \
              -DZLIB_LIBRARY_RELEASE=${{ github.workspace }}/build/zlib-win/zlibstatic.lib \
              -DZLIB_LIBRARY_DEBUG=${{ github.workspace }}/build/zlib-win/zlibstatic.lib \
              ${CCACHE:+-DCMAKE_C_COMPILER_LAUNCHER=$CCACHE -DCMAKE_CXX_COMPILER_LAUNCHER=$CCACHE}; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::configure failed after 3 attempts"
              exit 1
            fi
            echo "::warning::configure attempt $attempt failed, retrying"
            sleep $((attempt * 30))
          done

      - name: Build
        run: cmake --build build/radicle-win

      - name: ccache statistics
        if: always()
        run: if [ -n "$CCACHE" ]; then "$CCACHE" --show-stats; fi

      - name: Write artifact metadata
        if: always()
        run: |
          printf 'commit=%s\nref=%s\nrun_id=%s\ntarget=%s\n' \
            "${{ github.sha }}" "${{ github.ref }}" "${{ github.run_id }}" x86_64-pc-windows-msvc \
            > build/radicle-win/build-info.txt

      - name: Upload Windows binaries
        if: always()
        continue-on-error: true
        uses: https://code.forgejo.org/forgejo/upload-artifact@cb8afe72b42edc798abfb8fcb556cf660d894245 # v5
        with:
          name: radicle-windows-x64
          path: |
            build/radicle-win/**/*.exe
            build/radicle-win/**/*.dll
            build/radicle-win/**/*.lib
            build/radicle-win/build-info.txt
          if-no-files-found: warn
          retention-days: 7

  plugineditool-native-windows-cross:
    name: PluginEditTool native (Windows cross, clang-cl/xwin)
    if: github.event_name != 'pull_request' && github.event.inputs.lane != 'radicle-cross'
    runs-on: [self-hosted, Linux, X64, garden]
    timeout-minutes: 45
    # The native host now fetches the pinned WebView2 SDK itself. This lane also
    # forces the pinned zlib fallback used by package.ps1 (built from the cached
    # source), so the build matches a clean Windows release machine.
    # Tests are OFF here; native-windows-tests runs them with MSVC on the Windows
    # runner.
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Find ccache
        run: |
          for c in "$(command -v ccache || true)" "$HOME/.local/bin/ccache"; do
            if [ -n "$c" ] && [ -x "$c" ]; then
              echo "CCACHE=$c" >> "$GITHUB_ENV"
              echo "CCACHE_BASEDIR=$PWD" >> "$GITHUB_ENV"
              "$c" --zero-stats > /dev/null
              echo "Using $c"
              exit 0
            fi
          done
          echo "ccache not found; building without a compiler cache"

      - name: Pinned zlib source (cached)
        run: bash .github/scripts/pinned-zlib.sh

      - name: Configure native Windows host
        run: |
          for attempt in 1 2 3; do
            if cmake -S PluginEditTool/native -B build/fo4ide-win -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/cmake/xwin-clang-cl.cmake \
              -DCMAKE_BUILD_TYPE=Release \
              -DFO4IDE_BUILD_TESTS=OFF \
              -DFO4IDE_BUILD_HTTP=ON \
              -DCMAKE_DISABLE_FIND_PACKAGE_ZLIB=ON \
              -DFETCHCONTENT_SOURCE_DIR_FO4IDE_ZLIB="$ZLIB_SRC" \
              ${CCACHE:+-DCMAKE_C_COMPILER_LAUNCHER=$CCACHE -DCMAKE_CXX_COMPILER_LAUNCHER=$CCACHE}; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::configure failed after 3 attempts"
              exit 1
            fi
            echo "::warning::configure attempt $attempt failed, retrying"
            sleep $((attempt * 30))
          done

      - name: Build FO4RecordEditor.exe
        run: cmake --build build/fo4ide-win --target fo4ide

      - name: ccache statistics
        if: always()
        run: if [ -n "$CCACHE" ]; then "$CCACHE" --show-stats; fi

      - name: Verify native Windows executable
        run: test -f build/fo4ide-win/bin/FO4RecordEditor.exe

      - name: Upload native Windows executable
        if: always()
        continue-on-error: true
        uses: https://code.forgejo.org/forgejo/upload-artifact@cb8afe72b42edc798abfb8fcb556cf660d894245 # v5
        with:
          name: fo4recordeditor-windows-x64
          path: build/fo4ide-win/bin/FO4RecordEditor.exe
          if-no-files-found: warn
          retention-days: 7

  # Builds in the job's own workspace with Ninja + ccache, so concurrent jobs
  # never share a build directory.
  native-windows-tests:
    name: Native tests (Windows, MSVC)
    if: github.event.inputs.lane != 'radicle-cross'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet-8.0.424
        with:
          global-json-file: Radicle/bindings/csharp/global.json

      - name: Restore RID consumer (win-x64)
        shell: powershell
        run: |
          $consumer = Join-Path $env:RUNNER_TEMP 'radicle-consumer'
          New-Item -ItemType Directory -Force $consumer | Out-Null
          Copy-Item Radicle/bindings/csharp/global.json "$consumer/global.json"
          $library = [Security.SecurityElement]::Escape((Resolve-Path Radicle/bindings/csharp/Radicle.Interop/Radicle.Interop.csproj).Path)
          "<Project Sdk=`"Microsoft.NET.Sdk`"><PropertyGroup><TargetFramework>net8.0</TargetFramework><EnableDefaultCompileItems>false</EnableDefaultCompileItems></PropertyGroup><ItemGroup><ProjectReference Include=`"$library`" /></ItemGroup></Project>" | Set-Content "$consumer/Consumer.csproj"
          Set-Location $consumer
          dotnet restore Consumer.csproj -r win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up MSVC, Ninja and ccache
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .github/scripts/setup-msvc-ccache.ps1

      - name: Pinned zlib source (cached)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .github/scripts/pinned-zlib-windows.ps1

      - name: Configure
        timeout-minutes: 15
        shell: powershell
        run: |
          $launcher = @()
          if ($env:CCACHE) { $launcher = @("-DCMAKE_C_COMPILER_LAUNCHER=$env:CCACHE", "-DCMAKE_CXX_COMPILER_LAUNCHER=$env:CCACHE") }
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            cmake -S PluginEditTool\native -B build\native -G Ninja -DCMAKE_BUILD_TYPE=Release -DFO4IDE_BUILD_TESTS=ON -DFO4IDE_BUILD_HTTP=ON -DCMAKE_DISABLE_FIND_PACKAGE_ZLIB=ON "-DFETCHCONTENT_SOURCE_DIR_FO4IDE_ZLIB=$env:ZLIB_SRC" -DRADICLE_BUILD_TESTS=ON -DRADICLE_BUILD_TOOLS=ON -DRADICLE_CSHARP_TESTS=ON -DRADICLE_WARNINGS_AS_ERRORS=ON @launcher
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) {
              Write-Output "::error::configure failed after 3 attempts"
              exit 1
            }
            Write-Output "::warning::configure attempt $attempt failed, retrying"
            Start-Sleep -Seconds (30 * $attempt)
          }

      - name: Build
        run: cmake --build build\native -- -k 0

      - name: ccache statistics
        if: always()
        run: if defined CCACHE "%CCACHE%" --show-stats

      - name: Test
        shell: powershell
        run: |
          Remove-Item Env:FO4_DATA_DIR -ErrorAction SilentlyContinue
          $ctestArgs = @('--test-dir', 'build\native', '--output-on-failure', '--parallel', '4', '-E', $env:REAL_DATA_TEST_REGEX)
          ctest @ctestArgs
          exit $LASTEXITCODE

      - name: Write artifact metadata
        if: always()
        run: |
          echo commit=${{ github.sha }}> build\native\build-info.txt
          echo ref=${{ github.ref }}>> build\native\build-info.txt
          echo run_id=${{ github.run_id }}>> build\native\build-info.txt
          echo target=x86_64-pc-windows-msvc>> build\native\build-info.txt

      - name: Upload Radicle Release test executable
        if: always()
        continue-on-error: true
        uses: https://code.forgejo.org/forgejo/upload-artifact@v5
        with:
          name: radicle-msvc-release-tests
          path: |
            build/native/**/fo4_tests.exe
            build/native/**/radicle.dll
            build/native/build-info.txt
          if-no-files-found: warn
          retention-days: 7

      # The Debug pass repeats the whole MSVC build; Native (Linux, Debug) covers
      # Debug on pull requests, so this runs on main pushes and manual runs.
      # /Z7 (Embedded) instead of CMake's default /Zi: ccache can't cache
      # compiles that write to a shared PDB.
      - name: Configure (Debug)
        timeout-minutes: 15
        if: github.event_name != 'pull_request'
        shell: powershell
        run: |
          $launcher = @()
          if ($env:CCACHE) { $launcher = @("-DCMAKE_C_COMPILER_LAUNCHER=$env:CCACHE", "-DCMAKE_CXX_COMPILER_LAUNCHER=$env:CCACHE") }
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            cmake -S PluginEditTool\native -B build\native-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded -DFO4IDE_BUILD_TESTS=ON -DFO4IDE_BUILD_HTTP=ON -DCMAKE_DISABLE_FIND_PACKAGE_ZLIB=ON "-DFETCHCONTENT_SOURCE_DIR_FO4IDE_ZLIB=$env:ZLIB_SRC" -DRADICLE_BUILD_TESTS=ON -DRADICLE_BUILD_TOOLS=ON -DRADICLE_CSHARP_TESTS=ON -DRADICLE_WARNINGS_AS_ERRORS=ON @launcher
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) {
              Write-Output "::error::configure failed after 3 attempts"
              exit 1
            }
            Write-Output "::warning::configure attempt $attempt failed, retrying"
            Start-Sleep -Seconds (30 * $attempt)
          }

      - name: Build (Debug)
        if: github.event_name != 'pull_request'
        run: cmake --build build\native-debug

      # Real-data tests run only in native-windows-real-data; Debug with game data exceeds the job timeout.
      - name: Test (Debug)
        if: github.event_name != 'pull_request'
        run: |
          set FO4_DATA_DIR=
          ctest --test-dir build\native-debug --output-on-failure --parallel 4 -E "^radicle_csharp_bindings$"

      - name: Stop .NET build servers
        if: always()
        run: dotnet build-server shutdown

  # Runs only on the host labelled `fo4-data`, where the Fallout 4 Data folder exists.
  native-windows-real-data:
    name: Native real-data tests (Windows, MSVC, Fallout 4 data)
    if: github.event.inputs.lane != 'radicle-cross'
    runs-on: [fo4-data]
    timeout-minutes: 90
    defaults:
      run:
        shell: cmd
    steps:
      - name: Print Fallout 4 build (exe file version and Steam buildid)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          try {
            if (-not $env:FO4_DATA_DIR) { "FO4_DATA_DIR is unset; no Fallout 4 build to report."; exit 0 }
            $data = $env:FO4_DATA_DIR.TrimEnd('\','/')
            $steamRoot = Split-Path -Parent (Split-Path -Parent (Split-Path -Parent $data))
            $exe = Join-Path (Split-Path -Parent $data) 'Fallout4.exe'
            if (Test-Path -LiteralPath $exe -PathType Leaf) {
              "Fallout4.exe file version: $((Get-Item -LiteralPath $exe).VersionInfo.FileVersion)"
            } else {
              "Fallout4.exe not found at $exe"
            }
            $manifest = Join-Path $steamRoot 'appmanifest_377160.acf'
            $buildid = if (Test-Path -LiteralPath $manifest -PathType Leaf) {
              Select-String -LiteralPath $manifest -Pattern '"buildid"\s+"(\d+)"' | Select-Object -First 1
            }
            if ($buildid) { "Steam buildid: $($buildid.Matches[0].Groups[1].Value)" } else { "Steam appmanifest_377160.acf buildid not found under $steamRoot" }
          } catch { "build probe failed: $_" }
          exit 0
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check FO4 data folder
        id: fo4
        shell: powershell
        run: |
          if (-not $env:FO4_DATA_DIR) {
            "::notice::this runner has no Fallout 4 data configured (FO4_DATA_DIR is unset); the real-data tests are not run."
            [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "has_data=false`n")
            exit 0
          }
          if (-not (Test-Path -LiteralPath $env:FO4_DATA_DIR -PathType Container)) {
            "FO4_DATA_DIR ($env:FO4_DATA_DIR) is not an existing folder; point it at a Fallout 4 Data folder or unset it."
            exit 1
          }
          $missing = @()
          foreach ($m in 'Fallout4.esm', 'DLCRobot.esm', 'DLCworkshop01.esm', 'DLCworkshop02.esm', 'DLCworkshop03.esm', 'DLCCoast.esm', 'DLCNukaWorld.esm') {
            if (-not (Test-Path -LiteralPath (Join-Path $env:FO4_DATA_DIR $m) -PathType Leaf)) { $missing += $m }
          }
          if (-not (Get-ChildItem -LiteralPath $env:FO4_DATA_DIR -Filter 'Fallout4 - *.ba2' -File -ErrorAction SilentlyContinue)) { $missing += 'Fallout4 - *.ba2' }
          if ($missing) {
            "FO4_DATA_DIR ($env:FO4_DATA_DIR) is missing: $($missing -join ', '); point it at a Fallout 4 Data folder or unset it."
            exit 1
          }
          "FO4_DATA_DIR: $env:FO4_DATA_DIR"
          $esm = @(Get-ChildItem -LiteralPath $env:FO4_DATA_DIR -Filter *.esm -File).Count
          $ba2 = @(Get-ChildItem -LiteralPath $env:FO4_DATA_DIR -Filter *.ba2 -File).Count
          "root *.esm: $esm, *.ba2: $ba2"
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "has_data=true`n")

      - name: Select real-data tests
        if: steps.fo4.outputs.has_data == 'true'
        shell: powershell
        run: |
          if ($env:GITHUB_EVENT_NAME -ne 'pull_request') {
            Write-Output 'Not a pull request; running all real-data tests.'
            exit 0
          }
          $groups = @(
            @{ Name = 'Quest'; Tests = 'QuestAliasRealData|QuestStagesRealData|QuestObjectivesRealData|QuestAuthoringRealData|QuestRuntimeReal'; Trigger = 'quest|vmad|papyrus|pex|alias|condition|ctda' }
            @{ Name = 'Writeback'; Tests = 'WritebackRealData'; Trigger = 'writeback|placed|reference|refr|ref_|master|environment|remap' }
            @{ Name = 'SubrecordAuthoring'; Tests = 'SubrecordAuthoringRealData'; Trigger = 'subrecord|authoring' }
            @{ Name = 'StructPayload'; Tests = 'StructPayloadFormLinksRealData'; Trigger = 'struct|payload|proj_expl|hazd' }
            @{ Name = 'TypedFamilies'; Tests = 'TypedFamiliesRealData'; Trigger = 'typed|famil|armor|armo|arma|race|eyes|leveled|lvsp' }
          )
          $core = @(
            '^Radicle/(src|include/fo4)/binary/'
            '^Radicle/(src|include/fo4)/plugin/(reader|writer|visit|container|tes4|field_writer|mutation|record_edit|flags)\.'
            '^Radicle/(src|include/fo4)/(form_?id|plugin_key|signature|error|headers|fo4|flags)\.'
            '^Radicle/(src|include/fo4)/(text|localization|io)/'
            '^Radicle/(src|include/fo4)/environment/strings\.'
            '^Radicle/(src|include/fo4)/schema/(scalar|field_address|localized_fields|form_link|nested_formlink|formlink_lists|non_formid_slots|preflight|record_constraints|generated_record)'
            '^Radicle/schema/'
            '^Radicle/tools/.*codegen'
            '^(Radicle|PluginEditTool/native)/(.*/)?CMakeLists\.txt$|^cmake/|\.cmake$'
            '^\.github/(workflows/native-ci\.yml|scripts/)'
            '^Radicle/tests/plugin_bytes\.'
            '^Radicle/(src|include/fo4)/plugin/onam\.'
            '^Radicle/(src|include/fo4)/schema/(ctda|vmad)\.'
            '^Radicle/include/fo4/schema/[^/]+\.inc$'
            '^Radicle/(src|include/fo4)/forms/proj_expl_hazd\.'
          )
          $coreRegex = $core -join '|'
          git fetch --no-tags --depth=1 origin "$env:GITHUB_BASE_REF"
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::warning::could not fetch base branch $env:GITHUB_BASE_REF; running all real-data tests."
            exit 0
          }
          $changed = @(git diff --name-only --no-renames FETCH_HEAD HEAD)
          if ($LASTEXITCODE -ne 0 -or -not $changed) {
            Write-Output '::warning::could not determine the changed files; running all real-data tests.'
            exit 0
          }
          $coreHits = @($changed | Where-Object { $_ -match $coreRegex })
          if ($coreHits) {
            $coreHits | Select-Object -First 20 | ForEach-Object { Write-Output "core change: $_" }
            Write-Output 'Shared real-data code changed; running all real-data tests.'
            exit 0
          }
          $skipped = @()
          foreach ($group in $groups) {
            $hits = @($changed | Where-Object { $_ -match $group.Trigger })
            if ($hits) {
              Write-Output "RUN  $($group.Name): $((($hits | Select-Object -First 20)) -join ', ')"
            } else {
              Write-Output "SKIP $($group.Name): no changed path matches $($group.Trigger)"
              $skipped += $group.Tests
            }
          }
          if ($skipped) {
            $excludeRegex = '^(' + ($skipped -join '|') + ')\.'
            [IO.File]::AppendAllText($env:GITHUB_ENV, "CTEST_EXCLUDE_REGEX=$excludeRegex`n")
          } else {
            Write-Output 'Every expensive real-data group runs on this pull request.'
          }

      - name: Set up MSVC, Ninja and ccache
        if: steps.fo4.outputs.has_data == 'true'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .github/scripts/setup-msvc-ccache.ps1

      - name: Pinned zlib source (cached)
        if: steps.fo4.outputs.has_data == 'true'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .github/scripts/pinned-zlib-windows.ps1

      - name: Configure
        timeout-minutes: 15
        if: steps.fo4.outputs.has_data == 'true'
        shell: powershell
        run: |
          $launcher = @()
          if ($env:CCACHE) { $launcher = @("-DCMAKE_C_COMPILER_LAUNCHER=$env:CCACHE", "-DCMAKE_CXX_COMPILER_LAUNCHER=$env:CCACHE") }
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            cmake -S PluginEditTool\native -B build\native -G Ninja -DCMAKE_BUILD_TYPE=Release -DFO4IDE_BUILD_TESTS=ON -DFO4IDE_BUILD_HTTP=ON -DCMAKE_DISABLE_FIND_PACKAGE_ZLIB=ON "-DFETCHCONTENT_SOURCE_DIR_FO4IDE_ZLIB=$env:ZLIB_SRC" -DRADICLE_BUILD_TESTS=ON -DRADICLE_BUILD_TOOLS=ON -DRADICLE_CSHARP_TESTS=OFF -DRADICLE_WARNINGS_AS_ERRORS=ON @launcher
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) {
              Write-Output "::error::configure failed after 3 attempts"
              exit 1
            }
            Write-Output "::warning::configure attempt $attempt failed, retrying"
            Start-Sleep -Seconds (30 * $attempt)
          }

      - name: Build
        if: steps.fo4.outputs.has_data == 'true'
        run: cmake --build build\native --target fo4_tests fo4ide_test_sound_semantic_real -- -k 0

      - name: ccache statistics
        if: always() && steps.fo4.outputs.has_data == 'true'
        run: if defined CCACHE "%CCACHE%" --show-stats

      - name: Test
        if: steps.fo4.outputs.has_data == 'true'
        shell: powershell
        run: |
          $pscRoots = @((Join-Path $env:FO4_DATA_DIR 'Scripts\Source\User'), (Join-Path $env:FO4_DATA_DIR 'Scripts\Source\Base')) -join ';'
          $env:FO4_PSC_CORPUS = $pscRoots
          $env:FO4RE_PSC_CORPUS = $pscRoots
          $env:FO4RE_PSC_ROOTS = $pscRoots
          # TODO(papyrus-gates): PEX gates (FO4RE_PEX_CORPUS, FO4_PEX_CORPUS, FO4RE_PEX_RELEASE=1) need a staged vanilla .pex root; no Windows staging route is verified, see docs/papyrus-real-data-gates.md.
          $ctestArgs = @('--test-dir', 'build\native', '--output-on-failure', '--parallel', '4', '--no-tests=error', '-R', $env:REAL_DATA_TEST_REGEX)
          if ($env:CTEST_EXCLUDE_REGEX) { $ctestArgs += @('-E', $env:CTEST_EXCLUDE_REGEX) }
          ctest @ctestArgs
          exit $LASTEXITCODE
