name: native-ci

# Self-hosted runners execute arbitrary build code and must never see input
# from untrusted forks. Each lane therefore has two jobs sharing one composite
# build action:
#
#   *-hosted      plain pull_request events, on ephemeral GitHub-hosted runners
#   *-selfhosted  pushes to main/work/**, workflow_dispatch, and PRs labeled
#                 "ci:self-hosted" by a collaborator, on the garden fleet
#
# Windows cross-compilation requires the self-hosted xwin toolchain and is
# skipped entirely for unlabeled PRs (no hosted replacement; see radicle.yml).

on:
  push:
    branches:
      - main
      - "work/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: native-ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  radicle-linux-hosted:
    name: Radicle (Linux, Debug, hosted)
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ci:self-hosted')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Publish pending status
        uses: ./.github/actions/commit-status
        with:
          context: native-ci/radicle-linux
          state: pending
          description: Radicle Linux CI is running
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and test
        uses: ./.github/actions/radicle-linux-ci
        with:
          install-deps: 'true'

      - name: Upload failure diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: radicle-linux-hosted-failure
          path: |
            build/radicle/Testing/**
            build/radicle/**/*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish commit status
        if: always()
        uses: ./.github/actions/commit-status
        with:
          context: native-ci/radicle-linux
          state: ${{ job.status == 'success' && 'success' || job.status == 'failure' && 'failure' || 'error' }}
          description: Radicle Linux CI ${{ job.status }}
          token: ${{ secrets.GITHUB_TOKEN }}

  radicle-linux-selfhosted:
    name: Radicle (Linux, Debug, self-hosted)
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:self-hosted')
    runs-on: [self-hosted, Linux, X64, garden]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Publish pending status
        uses: ./.github/actions/commit-status
        with:
          context: native-ci/radicle-linux
          state: pending
          description: Radicle Linux CI is running
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and test
        uses: ./.github/actions/radicle-linux-ci

      - name: Upload failure diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: radicle-linux-failure
          path: |
            build/radicle/Testing/**
            build/radicle/**/*.log
            build/radicle/bin/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish commit status
        if: always()
        uses: ./.github/actions/commit-status
        with:
          context: native-ci/radicle-linux
          state: ${{ job.status == 'success' && 'success' || job.status == 'failure' && 'failure' || 'error' }}
          description: Radicle Linux CI ${{ job.status }}
          token: ${{ secrets.GITHUB_TOKEN }}

  fo4ide-linux-hosted:
    name: PluginEditTool native (Linux, Debug, hosted)
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ci:self-hosted')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Publish pending status
        uses: ./.github/actions/commit-status
        with:
          context: native-ci/fo4ide-linux
          state: pending
          description: PluginEditTool Linux CI is running
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and test
        uses: ./.github/actions/fo4ide-linux-ci
        with:
          install-deps: 'true'

      - name: Upload failure diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: fo4ide-native-linux-hosted-failure
          path: |
            build/fo4ide/Testing/**
            build/fo4ide/**/*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish commit status
        if: always()
        uses: ./.github/actions/commit-status
        with:
          context: native-ci/fo4ide-linux
          state: ${{ job.status == 'success' && 'success' || job.status == 'failure' && 'failure' || 'error' }}
          description: PluginEditTool Linux CI ${{ job.status }}
          token: ${{ secrets.GITHUB_TOKEN }}

  fo4ide-linux-selfhosted:
    name: PluginEditTool native (Linux, Debug, self-hosted)
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:self-hosted')
    runs-on: [self-hosted, Linux, X64, garden]
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Publish pending status
        uses: ./.github/actions/commit-status
        with:
          context: native-ci/fo4ide-linux
          state: pending
          description: PluginEditTool Linux CI is running
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and test
        uses: ./.github/actions/fo4ide-linux-ci

      - name: Upload failure diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: fo4ide-native-linux-failure
          path: |
            build/fo4ide/Testing/**
            build/fo4ide/**/*.log
            build/fo4ide/bin/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish commit status
        if: always()
        uses: ./.github/actions/commit-status
        with:
          context: native-ci/fo4ide-linux
          state: ${{ job.status == 'success' && 'success' || job.status == 'failure' && 'failure' || 'error' }}
          description: PluginEditTool Linux CI ${{ job.status }}
          token: ${{ secrets.GITHUB_TOKEN }}

  radicle-windows-cross:
    name: Radicle (Windows cross, clang-cl/xwin, build-only)
    # The xwin toolchain only lives on the self-hosted fleet; never run
    # untrusted PR code there. No hosted replacement exists — this lane is a
    # push/dispatch/labeled-PR gate only.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:self-hosted')
    runs-on: [self-hosted, Linux, X64, garden]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Publish pending status
        uses: ./.github/actions/commit-status
        with:
          context: native-ci/radicle-windows-cross
          state: pending
          description: Radicle Windows cross CI is running
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Windows static zlib dependency
        run: |
          git clone --filter=blob:none https://github.com/madler/zlib.git build/zlib-src
          git -C build/zlib-src checkout 51b7f2abdade71cd9bb0e7a373ef2610ec6f9daf  # v1.3.1
          cmake -S build/zlib-src -B build/zlib-win -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${GITHUB_WORKSPACE}/cmake/xwin-clang-cl.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DZLIB_BUILD_EXAMPLES=OFF
          cmake --build build/zlib-win --target zlibstatic
          cp build/zlib-src/zlib.h build/zlib-win/zlib.h
          test -f build/zlib-win/zconf.h
          test -f build/zlib-win/zlibstatic.lib

      - name: Configure
        run: >
          cmake -S Radicle -B build/radicle-win -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/cmake/xwin-clang-cl.cmake
          -DCMAKE_BUILD_TYPE=Release
          -DRADICLE_BUILD_TESTS=OFF
          -DZLIB_INCLUDE_DIR=${{ github.workspace }}/build/zlib-win
          -DZLIB_LIBRARY=${{ github.workspace }}/build/zlib-win/zlibstatic.lib
          -DZLIB_LIBRARY_RELEASE=${{ github.workspace }}/build/zlib-win/zlibstatic.lib
          -DZLIB_LIBRARY_DEBUG=${{ github.workspace }}/build/zlib-win/zlibstatic.lib

      - name: Build
        run: cmake --build build/radicle-win

      - name: Upload Windows binaries
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: radicle-windows-x64
          path: |
            build/radicle-win/**/*.exe
            build/radicle-win/**/*.dll
            build/radicle-win/**/*.lib
          if-no-files-found: warn
          retention-days: 14

      - name: Publish commit status
        if: always()
        uses: ./.github/actions/commit-status
        with:
          context: native-ci/radicle-windows-cross
          state: ${{ job.status == 'success' && 'success' || job.status == 'failure' && 'failure' || 'error' }}
          description: Radicle Windows cross CI ${{ job.status }}
          token: ${{ secrets.GITHUB_TOKEN }}
