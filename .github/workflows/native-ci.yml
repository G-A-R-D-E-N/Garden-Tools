name: native-ci

# Runs the native C++23 build/test on the self-hosted GARDEN-TOOLS runner
# (label `garden`). Hosted runners are intentionally avoided: both orgs are over
# the Free Actions minutes allowance (GHRUNNER#24), and hosted jobs fail silently
# once exhausted. Self-hosted minutes are free. Pull requests run through the
# pull_request trigger only; work-branch push runs are intentionally omitted so
# one PR commit does not consume two self-hosted CI slots.

# BGS/ is a self-contained C#/.NET tool with no bearing on the native C++ jobs
# below, so changes confined to it skip this workflow. paths-ignore (not an
# explicit paths allowlist) is deliberate: a commit touching BGS/ *and* anything
# else still runs the full build.
on:
  push:
    branches:
      - main
    paths-ignore:
      - "BGS/**"
  pull_request:
    paths-ignore:
      - "BGS/**"
  workflow_dispatch:

concurrency:
  group: native-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  radicle-linux:
    name: Radicle (Linux, Debug)
    runs-on: [self-hosted, Linux, X64, garden]
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure
        run: >
          cmake -S Radicle -B build/radicle -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DRADICLE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build/radicle

      - name: Test
        run: ctest --test-dir build/radicle --output-on-failure

      - name: Upload logs and binaries on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: radicle-linux-failure
          path: |
            build/radicle/Testing/**
            build/radicle/**/*.log
            build/radicle/bin/**
          if-no-files-found: ignore
          retention-days: 7

  plugineditool-native-linux:
    name: PluginEditTool native (Linux, Debug)
    runs-on: [self-hosted, Linux, X64, garden]
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure
        run: >
          cmake -S PluginEditTool/native -B build/fo4ide -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DFO4IDE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build/fo4ide

      - name: Test
        run: ctest --test-dir build/fo4ide --output-on-failure

      - name: Upload logs and binaries on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: fo4ide-native-linux-failure
          path: |
            build/fo4ide/Testing/**
            build/fo4ide/**/*.log
            build/fo4ide/bin/**
          if-no-files-found: ignore
          retention-days: 7

  radicle-windows-cross:
    name: Radicle (Windows cross, clang-cl/xwin, build-only)
    runs-on: [self-hosted, Linux, X64, garden]
    # Cross-compiles the Windows x64 build from Linux with clang-cl + the xwin
    # CRT/SDK (GHRUNNER#17) -- the same method used elsewhere on this host. Wine
    # is retired, so Windows binaries cannot be executed here: this job proves
    # the code COMPILES and LINKS for Windows (tests OFF). Native MSVC/WebView2
    # test execution still needs a real Windows runner if ever wanted.
    #
    # The xwin sysroot does not provide zlib, so this lane builds the pinned
    # static zlib dependency first and points find_package(ZLIB) at it.
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build Windows static zlib dependency
        run: |
          git clone --filter=blob:none https://github.com/madler/zlib.git build/zlib-src
          git -C build/zlib-src checkout 51b7f2abdade71cd9bb0e7a373ef2610ec6f9daf
          cmake -S build/zlib-src -B build/zlib-win -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${GITHUB_WORKSPACE}/cmake/xwin-clang-cl.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DZLIB_BUILD_EXAMPLES=OFF
          cmake --build build/zlib-win --target zlibstatic
          cp build/zlib-src/zlib.h build/zlib-win/zlib.h
          test -f build/zlib-win/zconf.h
          test -f build/zlib-win/zlibstatic.lib

      - name: Configure (clang-cl / xwin, Release)
        run: >
          cmake -S Radicle -B build/radicle-win -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/cmake/xwin-clang-cl.cmake
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DRADICLE_BUILD_TESTS=OFF
          -DZLIB_INCLUDE_DIR=${{ github.workspace }}/build/zlib-win
          -DZLIB_LIBRARY=${{ github.workspace }}/build/zlib-win/zlibstatic.lib
          -DZLIB_LIBRARY_RELEASE=${{ github.workspace }}/build/zlib-win/zlibstatic.lib
          -DZLIB_LIBRARY_DEBUG=${{ github.workspace }}/build/zlib-win/zlibstatic.lib

      - name: Build
        run: cmake --build build/radicle-win

      - name: Upload Windows binaries
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: radicle-windows-x64
          path: |
            build/radicle-win/**/*.exe
            build/radicle-win/**/*.dll
            build/radicle-win/**/*.lib
          if-no-files-found: warn
          retention-days: 7

  plugineditool-native-windows-cross:
    name: PluginEditTool native (Windows cross, clang-cl/xwin)
    runs-on: [self-hosted, Linux, X64, garden]
    # The native host now fetches the pinned WebView2 SDK itself. This lane also
    # forces the pinned zlib fallback used by package.ps1, so the build matches
    # a clean Windows release machine rather than depending on host packages.
    # Tests are build-only because the self-hosted runner is Linux and Wine is
    # intentionally retired.
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure native Windows host
        run: >
          cmake -S PluginEditTool/native -B build/fo4ide-win -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/cmake/xwin-clang-cl.cmake
          -DCMAKE_BUILD_TYPE=Release
          -DFO4IDE_BUILD_TESTS=OFF
          -DFO4IDE_BUILD_HTTP=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_ZLIB=ON

      - name: Build FO4RecordEditor.exe
        run: cmake --build build/fo4ide-win --target fo4ide

      - name: Verify native Windows executable
        run: test -f build/fo4ide-win/bin/FO4RecordEditor.exe

      - name: Upload native Windows executable
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: fo4recordeditor-windows-x64
          path: build/fo4ide-win/bin/FO4RecordEditor.exe
          if-no-files-found: warn
          retention-days: 7

  radicle-windows:
    name: Radicle (Windows, MSVC, Debug)
    runs-on: [self-hosted, Windows, X64]
    # Native MSVC 2022 build + test on the self-hosted Windows runner. Unlike
    # the xwin cross lane above, this one executes the test suite. zlib is
    # built from the same pinned commit (Debug, to match the /MDd CRT).
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build static zlib dependency (MSVC, Debug)
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --filter=blob:none https://github.com/madler/zlib.git build/zlib-src
          git -C build/zlib-src checkout 51b7f2abdade71cd9bb0e7a373ef2610ec6f9daf
          cmake -S build/zlib-src -B build/zlib-msvc -G "Visual Studio 17 2022" -A x64 -DZLIB_BUILD_EXAMPLES=OFF
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/zlib-msvc --config Debug --target zlibstatic
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item build/zlib-src/zlib.h build/zlib-msvc/zlib.h
          $lib = Get-ChildItem build/zlib-msvc/Debug -Filter 'zlibstatic*.lib' | Select-Object -First 1
          if (-not $lib) { throw "zlibstatic lib not found" }
          "ZLIB_LIB=$($lib.FullName -replace '\\','/')" >> $env:GITHUB_ENV

      - name: Configure
        run: >
          cmake -S Radicle -B build/radicle-msvc -G "Visual Studio 17 2022" -A x64
          -DBUILD_TESTING=ON
          -DRADICLE_BUILD_TESTS=ON
          -DZLIB_INCLUDE_DIR="${{ github.workspace }}/build/zlib-msvc"
          -DZLIB_LIBRARY="$env:ZLIB_LIB"

      - name: Build
        run: cmake --build build/radicle-msvc --config Debug

      - name: Test
        run: ctest --test-dir build/radicle-msvc -C Debug --output-on-failure

      - name: Upload logs and binaries on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: radicle-windows-msvc-failure
          path: |
            build/radicle-msvc/Testing/**
            build/radicle-msvc/**/*.log
            build/radicle-msvc/**/Debug/*.exe
          if-no-files-found: ignore
          retention-days: 7
