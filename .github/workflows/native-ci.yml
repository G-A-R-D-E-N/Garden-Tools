name: native-ci

# Runs the native C++23 build/test on the self-hosted GARDEN-TOOLS runners:
# Linux (label `garden`) and Windows (`self-hosted, Windows, X64`). Hosted runners
# are intentionally avoided: both orgs are over the Free Actions minutes
# allowance (GHRUNNER#24), and hosted jobs fail silently once exhausted.
# Self-hosted minutes are free. Pull requests run through the
# pull_request trigger only; work-branch push runs are intentionally omitted so
# one PR commit does not consume two self-hosted CI slots.

# Paths that no native target or test reads skip this workflow: the C#/.NET
# tools (BGS/, the FO4RecordEditor projects, Mutagen), the web frontend
# (the native app only points at web/dist at runtime), F4LODGEN, and docs.
# paths-ignore (not an explicit paths allowlist) is deliberate: a commit that
# also touches anything else still runs the full build.
on:
  push:
    branches:
      - main
    paths-ignore:
      - "BGS/**"
      - "F4LODGEN/**"
      - "PluginEditTool/web/**"
      - "PluginEditTool/FO4RecordEditor*/**"
      - "PluginEditTool/Mutagen/**"
      - "PluginEditTool/docs/**"
      - "PluginEditTool/images/**"
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "BGS/**"
      - "F4LODGEN/**"
      - "PluginEditTool/web/**"
      - "PluginEditTool/FO4RecordEditor*/**"
      - "PluginEditTool/Mutagen/**"
      - "PluginEditTool/docs/**"
      - "PluginEditTool/images/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      lane:
        description: Validation to run
        type: choice
        default: full
        options:
          - full
          - radicle-cross

# A newer push supersedes a pull request or branch run, but main runs always
# finish: cancelling them on every merge left main itself untested.
concurrency:
  group: native-ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

# Every job builds in its own fresh workspace, so compiles go through ccache
# (installed on the runner hosts) to avoid rebuilding unchanged sources.
# base_dir and nohashdir let hits carry across the per-job workspace paths.
# CCACHE_BASEDIR is written by each job's ccache step from its real working
# directory: `${{ github.workspace }}` is empty at workflow level on the
# host-mode runners, which left the base dir blank and the cache cold.
# A runner without ccache still builds, just without the cache.
env:
  CCACHE_NOHASHDIR: "1"
  # All runners share one 12-thread host; cap each build so concurrent jobs
  # don't oversubscribe it. cmake --build reads this when --parallel is absent.
  CMAKE_BUILD_PARALLEL_LEVEL: "4"

jobs:
  # paths-ignore compares the whole pull request, so a docs-only follow-up push
  # to a code PR still starts the full build. This job compares only the new push
  # and skips the heavy jobs when it touched nothing but ignored paths. Any doubt
  # (no before-sha, fetch failure) leaves run=true.
  gate:
    name: Gate (skip docs-only pushes)
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.lane != 'radicle-cross'
    runs-on: [self-hosted, Linux, X64, garden]
    timeout-minutes: 10
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          run=true
          if [ "$EVENT" = pull_request ] && [ -n "$BEFORE" ] \
             && git fetch --depth=1 origin "$BEFORE" 2>/dev/null; then
            if ! git diff --name-only "$BEFORE" HEAD \
               | grep -qvE '^(BGS|F4LODGEN|docs)/|^PluginEditTool/(web|FO4RecordEditor[^/]*|Mutagen|docs|images)/|\.md$'; then
              run=false
            fi
          fi
          echo "gate run=$run (before=${BEFORE:-none})"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  # PluginEditTool/native builds Radicle as a subproject, so one build covers
  # both: Radicle's own tests, tools and warnings-as-errors are switched on here
  # instead of compiling Radicle a second time in a separate job.
  native-linux:
    name: Native (Linux, Debug)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: [self-hosted, Linux, X64, garden]
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Find ccache
        run: |
          for c in "$(command -v ccache || true)" "$HOME/.local/bin/ccache"; do
            if [ -n "$c" ] && [ -x "$c" ]; then
              echo "CCACHE=$c" >> "$GITHUB_ENV"
              echo "CCACHE_BASEDIR=$PWD" >> "$GITHUB_ENV"
              "$c" --zero-stats > /dev/null
              echo "Using $c"
              exit 0
            fi
          done
          echo "ccache not found; building without a compiler cache"

      - name: Configure
        run: >
          cmake -S PluginEditTool/native -B build/native -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DFO4IDE_BUILD_TESTS=ON
          -DRADICLE_BUILD_TESTS=ON
          -DRADICLE_BUILD_TOOLS=ON
          -DRADICLE_CSHARP_TESTS=ON
          -DRADICLE_WARNINGS_AS_ERRORS=ON
          ${CCACHE:+-DCMAKE_C_COMPILER_LAUNCHER=$CCACHE -DCMAKE_CXX_COMPILER_LAUNCHER=$CCACHE}

      - name: Build
        run: cmake --build build/native

      - name: ccache statistics
        if: always()
        run: if [ -n "$CCACHE" ]; then "$CCACHE" --show-stats; fi

      - name: Test
        run: ctest --test-dir build/native --output-on-failure --parallel 4

      - name: Upload logs and binaries on failure
        if: failure()
        continue-on-error: true
        uses: https://code.forgejo.org/forgejo/upload-artifact@v5
        with:
          name: native-linux-failure
          path: |
            build/native/Testing/**
            build/native/**/*.log
            build/native/bin/**
          if-no-files-found: ignore
          retention-days: 7

  # The two Windows cross-compile lanes only prove the code compiles and links
  # with clang-cl/xwin. native-windows-tests already builds and tests the same
  # code with MSVC on every pull request, so these run on main only.
  radicle-windows-cross:
    name: Radicle (Windows cross, clang-cl/xwin, build-only)
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Linux, X64, garden]
    timeout-minutes: 45
    # Cross-compiles the Windows x64 build from Linux with clang-cl + the xwin
    # CRT/SDK (GHRUNNER#17) -- the same method used elsewhere on this host. Wine
    # is retired, so Windows binaries cannot be executed here: this job proves
    # the code COMPILES and LINKS for Windows (tests OFF). native-windows-tests
    # runs the tests with MSVC on the Windows runner.
    #
    # The xwin sysroot does not provide zlib, so this lane builds the pinned
    # static zlib dependency first and points find_package(ZLIB) at it.
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Find ccache
        run: |
          for c in "$(command -v ccache || true)" "$HOME/.local/bin/ccache"; do
            if [ -n "$c" ] && [ -x "$c" ]; then
              echo "CCACHE=$c" >> "$GITHUB_ENV"
              echo "CCACHE_BASEDIR=$PWD" >> "$GITHUB_ENV"
              "$c" --zero-stats > /dev/null
              echo "Using $c"
              exit 0
            fi
          done
          echo "ccache not found; building without a compiler cache"

      - name: Build Windows static zlib dependency
        run: |
          git clone --filter=blob:none https://github.com/madler/zlib.git build/zlib-src
          git -C build/zlib-src checkout 51b7f2abdade71cd9bb0e7a373ef2610ec6f9daf
          cmake -S build/zlib-src -B build/zlib-win -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${GITHUB_WORKSPACE}/cmake/xwin-clang-cl.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DZLIB_BUILD_EXAMPLES=OFF \
            ${CCACHE:+-DCMAKE_C_COMPILER_LAUNCHER=$CCACHE -DCMAKE_CXX_COMPILER_LAUNCHER=$CCACHE}
          cmake --build build/zlib-win --target zlibstatic
          cp build/zlib-src/zlib.h build/zlib-win/zlib.h
          test -f build/zlib-win/zconf.h
          test -f build/zlib-win/zlibstatic.lib

      - name: Configure (clang-cl / xwin, Release)
        run: >
          cmake -S Radicle -B build/radicle-win -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/cmake/xwin-clang-cl.cmake
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DRADICLE_BUILD_TESTS=OFF
          -DZLIB_INCLUDE_DIR=${{ github.workspace }}/build/zlib-win
          -DZLIB_LIBRARY=${{ github.workspace }}/build/zlib-win/zlibstatic.lib
          -DZLIB_LIBRARY_RELEASE=${{ github.workspace }}/build/zlib-win/zlibstatic.lib
          -DZLIB_LIBRARY_DEBUG=${{ github.workspace }}/build/zlib-win/zlibstatic.lib
          ${CCACHE:+-DCMAKE_C_COMPILER_LAUNCHER=$CCACHE -DCMAKE_CXX_COMPILER_LAUNCHER=$CCACHE}

      - name: Build
        run: cmake --build build/radicle-win

      - name: ccache statistics
        if: always()
        run: if [ -n "$CCACHE" ]; then "$CCACHE" --show-stats; fi

      - name: Upload Windows binaries
        if: always()
        continue-on-error: true
        uses: https://code.forgejo.org/forgejo/upload-artifact@v5
        with:
          name: radicle-windows-x64
          path: |
            build/radicle-win/**/*.exe
            build/radicle-win/**/*.dll
            build/radicle-win/**/*.lib
          if-no-files-found: warn
          retention-days: 7

  plugineditool-native-windows-cross:
    name: PluginEditTool native (Windows cross, clang-cl/xwin)
    if: github.event_name != 'pull_request' && github.event.inputs.lane != 'radicle-cross'
    runs-on: [self-hosted, Linux, X64, garden]
    timeout-minutes: 45
    # The native host now fetches the pinned WebView2 SDK itself. This lane also
    # forces the pinned zlib fallback used by package.ps1, so the build matches
    # a clean Windows release machine rather than depending on host packages.
    # Tests are OFF here; native-windows-tests runs them with MSVC on the Windows
    # runner.
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Find ccache
        run: |
          for c in "$(command -v ccache || true)" "$HOME/.local/bin/ccache"; do
            if [ -n "$c" ] && [ -x "$c" ]; then
              echo "CCACHE=$c" >> "$GITHUB_ENV"
              echo "CCACHE_BASEDIR=$PWD" >> "$GITHUB_ENV"
              "$c" --zero-stats > /dev/null
              echo "Using $c"
              exit 0
            fi
          done
          echo "ccache not found; building without a compiler cache"

      - name: Configure native Windows host
        run: >
          cmake -S PluginEditTool/native -B build/fo4ide-win -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/cmake/xwin-clang-cl.cmake
          -DCMAKE_BUILD_TYPE=Release
          -DFO4IDE_BUILD_TESTS=OFF
          -DFO4IDE_BUILD_HTTP=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_ZLIB=ON
          ${CCACHE:+-DCMAKE_C_COMPILER_LAUNCHER=$CCACHE -DCMAKE_CXX_COMPILER_LAUNCHER=$CCACHE}

      - name: Build FO4RecordEditor.exe
        run: cmake --build build/fo4ide-win --target fo4ide

      - name: ccache statistics
        if: always()
        run: if [ -n "$CCACHE" ]; then "$CCACHE" --show-stats; fi

      - name: Verify native Windows executable
        run: test -f build/fo4ide-win/bin/FO4RecordEditor.exe

      - name: Upload native Windows executable
        if: always()
        continue-on-error: true
        uses: https://code.forgejo.org/forgejo/upload-artifact@v5
        with:
          name: fo4recordeditor-windows-x64
          path: build/fo4ide-win/bin/FO4RecordEditor.exe
          if-no-files-found: warn
          retention-days: 7

  # Builds in the job's own workspace with Ninja + ccache, so concurrent jobs
  # never share a build directory.
  native-windows-tests:
    name: Native tests (Windows, MSVC)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        env:
          DOTNET_INSTALL_DIR: ${{ github.workspace }}/build/dotnet
        with:
          dotnet-version: '8.0.x'

      - name: Set up MSVC, Ninja and ccache
        shell: powershell
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          if (-not (Test-Path "$installer\vswhere.exe")) { throw "Visual Studio is not installed on this runner" }
          $vs = & "$installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "No Visual Studio install with the C++ x64 tools on this runner" }
          $cmakeBin = "$vs\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin"
          $ninjaBin = "$vs\Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja"
          foreach ($tool in "$cmakeBin\cmake.exe", "$ninjaBin\ninja.exe") {
            if (-not (Test-Path $tool)) { throw "Visual Studio at $vs has no C++ CMake tools component ($tool)" }
          }

          # Ninja calls cl.exe directly, so later steps need the vcvars64 environment.
          $env:Path = "$installer;$env:Path"
          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
          $vcvars = cmd /c "`"$vs\VC\Auxiliary\Build\vcvars64.bat`" >nul && set"
          if ($LASTEXITCODE -ne 0) { throw "vcvars64.bat failed" }
          $newPaths = @($cmakeBin, $ninjaBin)
          foreach ($line in $vcvars) {
            if ($line -notmatch '^([^=]+)=(.*)$') { continue }
            $name = $Matches[1]; $value = $Matches[2]
            if ($name -ieq 'Path') {
              $old = $env:Path -split ';'
              $newPaths += @($value -split ';' | Where-Object { $_ -and $old -notcontains $_ })
            } elseif ($before[$name] -ne $value) {
              [IO.File]::AppendAllText($env:GITHUB_ENV, "$name=$value`n")
            }
          }
          # Each GITHUB_PATH line is prepended, so write in reverse to keep vcvars order.
          [array]::Reverse($newPaths)
          [IO.File]::AppendAllText($env:GITHUB_PATH, (($newPaths | Select-Object -Unique) -join "`n") + "`n")

          $ccache = (Get-Command ccache -ErrorAction SilentlyContinue).Source
          if (-not $ccache -and (Test-Path 'C:\tools\ccache\ccache.exe')) { $ccache = 'C:\tools\ccache\ccache.exe' }
          if ($ccache) {
            [IO.File]::AppendAllText($env:GITHUB_ENV, "CCACHE=$ccache`n")
            [IO.File]::AppendAllText($env:GITHUB_ENV, "CCACHE_BASEDIR=$((Get-Location).Path)`n")
            & $ccache --zero-stats | Out-Null
            "Using $ccache"
          } else {
            "ccache not found; building without a compiler cache"
          }

      - name: Configure
        run: |
          set "LAUNCHER="
          if defined CCACHE set "LAUNCHER=-DCMAKE_C_COMPILER_LAUNCHER=%CCACHE% -DCMAKE_CXX_COMPILER_LAUNCHER=%CCACHE%"
          cmake -S PluginEditTool\native -B build\native -G Ninja -DCMAKE_BUILD_TYPE=Release -DFO4IDE_BUILD_TESTS=ON -DFO4IDE_BUILD_HTTP=ON -DCMAKE_DISABLE_FIND_PACKAGE_ZLIB=ON -DRADICLE_BUILD_TESTS=ON -DRADICLE_BUILD_TOOLS=ON -DRADICLE_CSHARP_TESTS=ON -DRADICLE_WARNINGS_AS_ERRORS=ON %LAUNCHER% || exit /b 1

      - name: Build
        run: cmake --build build\native

      - name: ccache statistics
        if: always()
        run: if defined CCACHE "%CCACHE%" --show-stats

      - name: Test
        run: ctest --test-dir build\native --output-on-failure --parallel 4

      - name: Upload Radicle Release test executable
        if: always()
        continue-on-error: true
        uses: https://code.forgejo.org/forgejo/upload-artifact@v5
        with:
          name: radicle-msvc-release-tests
          path: |
            build/native/**/fo4_tests.exe
            build/native/**/radicle.dll
          if-no-files-found: warn
          retention-days: 7

      # The Debug pass repeats the whole MSVC build; Native (Linux, Debug) covers
      # Debug on pull requests, so this runs on main pushes and manual runs.
      # /Z7 (Embedded) instead of CMake's default /Zi: ccache can't cache
      # compiles that write to a shared PDB.
      - name: Configure (Debug)
        if: github.event_name != 'pull_request'
        run: |
          set "LAUNCHER="
          if defined CCACHE set "LAUNCHER=-DCMAKE_C_COMPILER_LAUNCHER=%CCACHE% -DCMAKE_CXX_COMPILER_LAUNCHER=%CCACHE%"
          cmake -S PluginEditTool\native -B build\native-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded -DFO4IDE_BUILD_TESTS=ON -DFO4IDE_BUILD_HTTP=ON -DCMAKE_DISABLE_FIND_PACKAGE_ZLIB=ON -DRADICLE_BUILD_TESTS=ON -DRADICLE_BUILD_TOOLS=ON -DRADICLE_CSHARP_TESTS=ON -DRADICLE_WARNINGS_AS_ERRORS=ON %LAUNCHER% || exit /b 1

      - name: Build (Debug)
        if: github.event_name != 'pull_request'
        run: cmake --build build\native-debug

      - name: Test (Debug)
        if: github.event_name != 'pull_request'
        run: ctest --test-dir build\native-debug --output-on-failure --parallel 4

      - name: Stop .NET build servers
        if: always()
        run: dotnet build-server shutdown
