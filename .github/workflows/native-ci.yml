name: native-ci

# Self-hosted only, deliberately. GARDEN-TOOLS is a private repo: nobody
# outside the org/collaborators can open a PR against it, so there is no
# untrusted-fork threat to isolate from with a hosted lane -- and hosted
# runners are not a safe fallback anyway: both G-A-R-D-E-N and
# PRISMA-USER-INTERFACE-FRAMEWORK are well over the GitHub Free plan's 2,000
# Actions minutes/month allowance, so a hosted job fails instantly, every
# time, with no steps and no log (GHRUNNER#24). A prior version of this file
# added ubuntu-latest lanes for PR-triggered builds specifically to keep
# arbitrary PR code off the self-hosted fleet; that threat model doesn't
# apply to a private repo's own collaborators, and the "fallback" was in
# practice a guaranteed failure, not a safety net.

on:
  push:
    branches:
      - main
      - "work/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: native-ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  radicle-linux:
    name: Radicle (Linux, Debug)
    runs-on: [self-hosted, Linux, X64, garden]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Publish pending status
        uses: ./.github/actions/commit-status
        with:
          context: native-ci/radicle-linux
          state: pending
          description: Radicle Linux CI is running
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and test
        uses: ./.github/actions/radicle-linux-ci

      - name: Upload failure diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: radicle-linux-failure
          path: |
            build/radicle/Testing/**
            build/radicle/**/*.log
            build/radicle/bin/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish commit status
        if: always()
        uses: ./.github/actions/commit-status
        with:
          context: native-ci/radicle-linux
          state: ${{ job.status == 'success' && 'success' || job.status == 'failure' && 'failure' || 'error' }}
          description: Radicle Linux CI ${{ job.status }}
          token: ${{ secrets.GITHUB_TOKEN }}

  fo4ide-linux:
    name: PluginEditTool native (Linux, Debug)
    runs-on: [self-hosted, Linux, X64, garden]
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Publish pending status
        uses: ./.github/actions/commit-status
        with:
          context: native-ci/fo4ide-linux
          state: pending
          description: PluginEditTool Linux CI is running
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and test
        uses: ./.github/actions/fo4ide-linux-ci

      - name: Upload failure diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: fo4ide-native-linux-failure
          path: |
            build/fo4ide/Testing/**
            build/fo4ide/**/*.log
            build/fo4ide/bin/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish commit status
        if: always()
        uses: ./.github/actions/commit-status
        with:
          context: native-ci/fo4ide-linux
          state: ${{ job.status == 'success' && 'success' || job.status == 'failure' && 'failure' || 'error' }}
          description: PluginEditTool Linux CI ${{ job.status }}
          token: ${{ secrets.GITHUB_TOKEN }}

  radicle-windows-cross:
    name: Radicle (Windows cross, clang-cl/xwin, build-only)
    runs-on: [self-hosted, Linux, X64, garden]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Publish pending status
        uses: ./.github/actions/commit-status
        with:
          context: native-ci/radicle-windows-cross
          state: pending
          description: Radicle Windows cross CI is running
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Windows static zlib dependency
        run: |
          git clone --filter=blob:none https://github.com/madler/zlib.git build/zlib-src
          git -C build/zlib-src checkout 51b7f2abdade71cd9bb0e7a373ef2610ec6f9daf  # v1.3.1
          cmake -S build/zlib-src -B build/zlib-win -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${GITHUB_WORKSPACE}/cmake/xwin-clang-cl.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DZLIB_BUILD_EXAMPLES=OFF
          cmake --build build/zlib-win --target zlibstatic
          cp build/zlib-src/zlib.h build/zlib-win/zlib.h
          test -f build/zlib-win/zconf.h
          test -f build/zlib-win/zlibstatic.lib

      - name: Configure
        run: >
          cmake -S Radicle -B build/radicle-win -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/cmake/xwin-clang-cl.cmake
          -DCMAKE_BUILD_TYPE=Release
          -DRADICLE_BUILD_TESTS=OFF
          -DZLIB_INCLUDE_DIR=${{ github.workspace }}/build/zlib-win
          -DZLIB_LIBRARY=${{ github.workspace }}/build/zlib-win/zlibstatic.lib
          -DZLIB_LIBRARY_RELEASE=${{ github.workspace }}/build/zlib-win/zlibstatic.lib
          -DZLIB_LIBRARY_DEBUG=${{ github.workspace }}/build/zlib-win/zlibstatic.lib

      - name: Build
        run: cmake --build build/radicle-win

      - name: Upload Windows binaries
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: radicle-windows-x64
          path: |
            build/radicle-win/**/*.exe
            build/radicle-win/**/*.dll
            build/radicle-win/**/*.lib
          if-no-files-found: warn
          retention-days: 14

      - name: Publish commit status
        if: always()
        uses: ./.github/actions/commit-status
        with:
          context: native-ci/radicle-windows-cross
          state: ${{ job.status == 'success' && 'success' || job.status == 'failure' && 'failure' || 'error' }}
          description: Radicle Windows cross CI ${{ job.status }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # PluginEditTool's native backend is Windows/WebView2. The WebView2 SDK is NOT
  # part of xwin, so a clang-cl/xwin cross build will only work once WebView2's
  # headers/import libs are staged on the host (or vendored). Left out until that
  # dependency is sorted; the Linux native job above still exercises the shared
  # non-Windows code.
