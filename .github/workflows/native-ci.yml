name: native-ci

on:
  push:
    branches:
      - main
      - "work/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: native-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  radicle-linux:
    name: Radicle (Linux, Debug)
    runs-on: [self-hosted, Linux, X64, garden]
    steps:
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"pending\",\"context\":\"native-ci/radicle-linux\",\"description\":\"Radicle Linux self-hosted CI is running\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: >
          cmake -S Radicle -B build/radicle -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DRADICLE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build/radicle

      - name: Test
        run: ctest --test-dir build/radicle --output-on-failure

      - name: Upload failure diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: radicle-linux-failure
          path: |
            build/radicle/Testing/**
            build/radicle/**/*.log
            build/radicle/bin/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish commit status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state="$JOB_STATUS"
          if [ "$state" != success ] && [ "$state" != failure ]; then state=error; fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"$state\",\"context\":\"native-ci/radicle-linux\",\"description\":\"Radicle Linux self-hosted CI: $JOB_STATUS\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

  plugineditool-native-linux:
    name: PluginEditTool native (Linux, Debug)
    runs-on: [self-hosted, Linux, X64, garden]
    steps:
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"pending\",\"context\":\"native-ci/fo4ide-linux\",\"description\":\"PluginEditTool Linux self-hosted CI is running\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: >
          cmake -S PluginEditTool/native -B build/fo4ide -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DFO4IDE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build/fo4ide

      - name: Test
        run: ctest --test-dir build/fo4ide --output-on-failure

      - name: Upload failure diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: fo4ide-native-linux-failure
          path: |
            build/fo4ide/Testing/**
            build/fo4ide/**/*.log
            build/fo4ide/bin/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish commit status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state="$JOB_STATUS"
          if [ "$state" != success ] && [ "$state" != failure ]; then state=error; fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"$state\",\"context\":\"native-ci/fo4ide-linux\",\"description\":\"PluginEditTool Linux self-hosted CI: $JOB_STATUS\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

  radicle-windows-cross:
    name: Radicle (Windows cross, clang-cl/xwin, build-only)
    runs-on: [self-hosted, Linux, X64, garden]
    steps:
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"pending\",\"context\":\"native-ci/radicle-windows-cross\",\"description\":\"Radicle Windows cross CI is running\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Windows static zlib dependency
        run: |
          git clone --depth 1 --branch v1.3.1 https://github.com/madler/zlib.git build/zlib-src
          cmake -S build/zlib-src -B build/zlib-win -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${GITHUB_WORKSPACE}/cmake/xwin-clang-cl.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DZLIB_BUILD_EXAMPLES=OFF
          cmake --build build/zlib-win --target zlibstatic
          cp build/zlib-src/zlib.h build/zlib-win/zlib.h
          test -f build/zlib-win/zconf.h
          test -f build/zlib-win/zlibstatic.lib

      - name: Configure
        run: >
          cmake -S Radicle -B build/radicle-win -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/cmake/xwin-clang-cl.cmake
          -DCMAKE_BUILD_TYPE=Release
          -DRADICLE_BUILD_TESTS=OFF
          -DZLIB_INCLUDE_DIR=${{ github.workspace }}/build/zlib-win
          -DZLIB_LIBRARY=${{ github.workspace }}/build/zlib-win/zlibstatic.lib
          -DZLIB_LIBRARY_RELEASE=${{ github.workspace }}/build/zlib-win/zlibstatic.lib
          -DZLIB_LIBRARY_DEBUG=${{ github.workspace }}/build/zlib-win/zlibstatic.lib

      - name: Build
        run: cmake --build build/radicle-win

      - name: Upload Windows binaries
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: radicle-windows-x64
          path: |
            build/radicle-win/**/*.exe
            build/radicle-win/**/*.dll
            build/radicle-win/**/*.lib
          if-no-files-found: warn
          retention-days: 14

      - name: Publish commit status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state="$JOB_STATUS"
          if [ "$state" != success ] && [ "$state" != failure ]; then state=error; fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"$state\",\"context\":\"native-ci/radicle-windows-cross\",\"description\":\"Radicle Windows cross CI: $JOB_STATUS\",\"target_url\":\"https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
