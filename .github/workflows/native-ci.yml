name: native-ci

# Runs the native C++23 build/test on the self-hosted GARDEN-TOOLS runner
# (label `garden`). Hosted runners are intentionally avoided: both orgs are over
# the Free Actions minutes allowance (GHRUNNER#24), and hosted jobs fail silently
# once exhausted. Self-hosted minutes are free.

on:
  push:
    branches:
      - main
      - "work/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: native-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  radicle-linux:
    name: Radicle (Linux, Debug)
    runs-on: [self-hosted, Linux, X64, garden]
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: >
          cmake -S Radicle -B build/radicle -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DRADICLE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build/radicle

      - name: Test
        run: ctest --test-dir build/radicle --output-on-failure

      - name: Upload logs and binaries on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: radicle-linux-failure
          path: |
            build/radicle/Testing/**
            build/radicle/**/*.log
            build/radicle/bin/**
          if-no-files-found: ignore
          retention-days: 14

  plugineditool-native-linux:
    name: PluginEditTool native (Linux, Debug)
    runs-on: [self-hosted, Linux, X64, garden]
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: >
          cmake -S PluginEditTool/native -B build/fo4ide -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DFO4IDE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build/fo4ide

      - name: Test
        run: ctest --test-dir build/fo4ide --output-on-failure

      - name: Upload logs and binaries on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fo4ide-native-linux-failure
          path: |
            build/fo4ide/Testing/**
            build/fo4ide/**/*.log
            build/fo4ide/bin/**
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Windows acceptance (MSVC + Windows SDK + WebView2) needs a REAL Windows
  # runner. This Linux host cannot provide `[self-hosted, windows, garden]`
  # (that was the Wine dead-end, GHRUNNER#17, now retired). Register a Windows
  # box/VM against GARDEN-TOOLS, then uncomment:
  #
  # radicle-windows:
  #   name: Radicle (Windows, Debug)
  #   runs-on: [self-hosted, windows, garden]
  #   steps:
  #     - uses: actions/checkout@v4
  #       with: { submodules: recursive }
  #     - run: cmake -S Radicle -B build/radicle -G Ninja -DCMAKE_BUILD_TYPE=Debug -DRADICLE_BUILD_TESTS=ON
  #     - run: cmake --build build/radicle
  #     - run: ctest --test-dir build/radicle --output-on-failure
  #
  # plugineditool-native-windows:
  #   name: PluginEditTool native (Windows, Debug)
  #   runs-on: [self-hosted, windows, garden]
  #   steps:
  #     - uses: actions/checkout@v4
  #       with: { submodules: recursive }
  #     - run: cmake -S PluginEditTool/native -B build/fo4ide -G Ninja -DCMAKE_BUILD_TYPE=Debug -DFO4IDE_BUILD_TESTS=ON
  #     - run: cmake --build build/fo4ide
  #     - run: ctest --test-dir build/fo4ide --output-on-failure
