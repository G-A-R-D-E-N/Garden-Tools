name: native-ci

# Self-hosted runners execute arbitrary build code and must never see input
# from untrusted forks. The self-hosted jobs below therefore run only for:
#   - pushes to main/work/** branches (collaborator-authored refs), and
#   - pull requests explicitly labeled "ci:self-hosted" by a collaborator.
# Regular pull_request events are covered by the hosted mirror jobs, so PRs
# still get Linux Debug + Windows cross coverage without runner exposure.

on:
  push:
    branches:
      - main
      - "work/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: native-ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  radicle-linux:
    name: Radicle (Linux, Debug)
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         !contains(github.event.pull_request.labels.*.name, 'ci:self-hosted'))
        && 'ubuntu-latest'
        || format('[self-hosted, Linux, X64, garden]')
      }}
    timeout-minutes: 30
    steps:
      - name: Publish pending status
        uses: ./.github/actions/commit-status
        with:
          context: native-ci/radicle-linux
          state: pending
          description: Radicle Linux CI is running
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install native dependencies
        if: runner.environment == 'github-hosted'
        run: sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev

      - name: Configure
        run: >
          cmake -S Radicle -B build/radicle -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DRADICLE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build/radicle

      - name: Test
        run: ctest --test-dir build/radicle --output-on-failure

      - name: Upload failure diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: radicle-linux-failure
          path: |
            build/radicle/Testing/**
            build/radicle/**/*.log
            build/radicle/bin/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish commit status
        if: always()
        uses: ./.github/actions/commit-status
        with:
          context: native-ci/radicle-linux
          state: ${{ job.status == 'success' && 'success' || job.status == 'failure' && 'failure' || 'error' }}
          description: Radicle Linux CI ${{ job.status }}
          token: ${{ secrets.GITHUB_TOKEN }}

  plugineditool-native-linux:
    name: PluginEditTool native (Linux, Debug)
    runs-on: >-
      ${{
        (github.event_name == 'pull_request' &&
         !contains(github.event.pull_request.labels.*.name, 'ci:self-hosted'))
        && 'ubuntu-latest'
        || format('[self-hosted, Linux, X64, garden]')
      }}
    timeout-minutes: 40
    steps:
      - name: Publish pending status
        uses: ./.github/actions/commit-status
        with:
          context: native-ci/fo4ide-linux
          state: pending
          description: PluginEditTool Linux CI is running
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install native dependencies
        if: runner.environment == 'github-hosted'
        run: sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev

      - name: Configure
        run: >
          cmake -S PluginEditTool/native -B build/fo4ide -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DFO4IDE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build/fo4ide

      - name: Test
        run: ctest --test-dir build/fo4ide --output-on-failure

      - name: Upload failure diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: fo4ide-native-linux-failure
          path: |
            build/fo4ide/Testing/**
            build/fo4ide/**/*.log
            build/fo4ide/bin/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish commit status
        if: always()
        uses: ./.github/actions/commit-status
        with:
          context: native-ci/fo4ide-linux
          state: ${{ job.status == 'success' && 'success' || job.status == 'failure' && 'failure' || 'error' }}
          description: PluginEditTool Linux CI ${{ job.status }}
          token: ${{ secrets.GITHUB_TOKEN }}

  radicle-windows-cross:
    name: Radicle (Windows cross, clang-cl/xwin, build-only)
    # The xwin toolchain only lives on the self-hosted fleet, and this job
    # must never execute untrusted PR code there: skip plain PRs entirely,
    # run for pushes/dispatch and labeled PRs.
    if: >
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'ci:self-hosted')
    runs-on: [self-hosted, Linux, X64, garden]
    timeout-minutes: 30
    steps:
      - name: Publish pending status
        uses: ./.github/actions/commit-status
        with:
          context: native-ci/radicle-windows-cross
          state: pending
          description: Radicle Windows cross CI is running
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install cross toolchain dependencies
        if: runner.environment == 'github-hosted'
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang

      - name: Build Windows static zlib dependency
        run: |
          git clone --depth 1 https://github.com/madler/zlib.git build/zlib-src
          git -C build/zlib-src checkout 51b7f2abdade71cd9bb0e7a373ef2610ec6f9daf  # v1.3.1, hash-pinned
          cmake -S build/zlib-src -B build/zlib-win -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${GITHUB_WORKSPACE}/cmake/xwin-clang-cl.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DZLIB_BUILD_EXAMPLES=OFF
          cmake --build build/zlib-win --target zlibstatic
          cp build/zlib-src/zlib.h build/zlib-win/zlib.h
          test -f build/zlib-win/zconf.h
          test -f build/zlib-win/zlibstatic.lib

      - name: Configure
        run: >
          cmake -S Radicle -B build/radicle-win -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/cmake/xwin-clang-cl.cmake
          -DCMAKE_BUILD_TYPE=Release
          -DRADICLE_BUILD_TESTS=OFF
          -DZLIB_INCLUDE_DIR=${{ github.workspace }}/build/zlib-win
          -DZLIB_LIBRARY=${{ github.workspace }}/build/zlib-win/zlibstatic.lib
          -DZLIB_LIBRARY_RELEASE=${{ github.workspace }}/build/zlib-win/zlibstatic.lib
          -DZLIB_LIBRARY_DEBUG=${{ github.workspace }}/build/zlib-win/zlibstatic.lib

      - name: Build
        run: cmake --build build/radicle-win

      - name: Upload Windows binaries
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: radicle-windows-x64
          path: |
            build/radicle-win/**/*.exe
            build/radicle-win/**/*.dll
            build/radicle-win/**/*.lib
          if-no-files-found: warn
          retention-days: 14

      - name: Publish commit status
        if: always()
        uses: ./.github/actions/commit-status
        with:
          context: native-ci/radicle-windows-cross
          state: ${{ job.status == 'success' && 'success' || job.status == 'failure' && 'failure' || 'error' }}
          description: Radicle Windows cross CI ${{ job.status }}
          token: ${{ secrets.GITHUB_TOKEN }}
