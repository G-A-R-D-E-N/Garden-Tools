name: Public CI cleanup

on:
  push:
    branches: ["ci/**"]

permissions: {}

jobs:
  cleanup:
    name: Delete superseded and expired runs
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    concurrency:
      group: ${{ github.workflow }}-runs
      cancel-in-progress: false
    steps:
      - name: Delete completed ci/* runs that are superseded or over three days old
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          CURRENT: ${{ github.sha }}
        run: |
          set -euo pipefail
          cutoff=$(date -u -d '3 days ago' +%FT%TZ)
          declare -A latest=(["$BRANCH"]="$CURRENT")
          gh api "repos/$REPO/actions/runs?status=completed&per_page=100" --paginate \
            --jq '.workflow_runs[] | select(.head_branch | startswith("ci/")) | "\(.id) \(.head_branch) \(.head_sha) \(.created_at)"' > runs.txt
          while read -r id branch sha created; do
            latest[$branch]=${latest[$branch]:-$sha}
            [ "$sha" = "${latest[$branch]}" ] && [[ "$created" > "$cutoff" ]] && continue
            gh api -X DELETE "repos/$REPO/actions/runs/$id"
            echo "deleted run $id ($branch ${sha:0:8})"
          done < runs.txt

  delete-branch:
    name: Delete this ci branch when its runs finish
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      actions: read
      contents: write
    # A newer export to the same branch cancels this wait and starts its own.
    concurrency:
      group: ${{ github.workflow }}-branch-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Wait for this commit's runs, then delete the branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          CURRENT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          sleep 120
          while :; do
            active=$(gh api "repos/$REPO/actions/runs?head_sha=$CURRENT&per_page=100" \
              --jq "[.workflow_runs[] | select(.status != \"completed\" and .id != $RUN_ID)] | length")
            [ "$active" = 0 ] && break
            sleep 60
          done
          head=$(gh api "repos/$REPO/git/ref/heads/$BRANCH" --jq .object.sha) || { echo "$BRANCH is already gone"; exit 0; }
          [ "$head" = "$CURRENT" ] || { echo "$BRANCH moved to ${head:0:8}; leaving it"; exit 0; }
          gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH"
          echo "deleted $BRANCH"
